<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0c"><title>Desafio do Craque Mirim | Seleção de Baixa Grande</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#32120f,#090a0c 60%);color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:18px}
.wrap{max-width:800px;margin:0 auto}.back{display:inline-block;color:#f5ce70;text-decoration:none;font-size:13px;margin:8px 0 18px}.card{border:1px solid #4a3a20;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#17130d,#0c0d0f);box-shadow:0 24px 65px #0008}.head{text-align:center;padding:28px 20px 20px}.tag{color:#f5c35d;font-size:10px;font-weight:900;letter-spacing:2px}.head h1{font-size:clamp(29px,7vw,48px);line-height:1;margin:12px 0}.head h1 span{color:#f5c35d}.head p{color:#c5c0b6;line-height:1.6;font-size:13px;max-width:520px;margin:auto}.stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:20px}.stat{min-width:90px;padding:10px 15px;border:1px solid #403624;border-radius:10px;background:#0b0c0d;color:#b7afa0;font-size:9px;font-weight:900;letter-spacing:1px}.stat strong{display:block;color:#f5c35d;font-size:25px;margin-top:5px}.field{height:300px;position:relative;margin:0 16px 16px;overflow:hidden;border:2px solid #c1a75c;border-radius:14px;background:repeating-linear-gradient(0deg,#ffffff08 0 1px,transparent 1px 40px),linear-gradient(135deg,#15522e,#0c3c24 55%,#174b2c)}.field:before{content:"";position:absolute;inset:10px;border:1px solid #ffffff55;border-radius:8px}.field:after{content:"";position:absolute;left:50%;top:50%;width:85px;height:85px;border:1px solid #ffffff44;border-radius:50%;transform:translate(-50%,-50%)}#ball{position:absolute;z-index:2;left:calc(50% - 27px);top:calc(50% - 27px);width:54px;height:54px;border:0;border-radius:50%;background:white;font-size:31px;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 15px #0008}#ball:disabled{cursor:default}.message{min-height:24px;text-align:center;color:#f1d58c;font-size:12px;font-weight:800;padding:0 12px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 16px 24px}button.action{border:1px solid #e2b94e;border-radius:9px;padding:13px 18px;background:#e2b94e;color:#17130d;font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;cursor:pointer}button.secondary{background:transparent;color:#f5d785;border-color:#4c422b}footer{text-align:center;color:#7d7d7d;font-size:11px;margin:18px 0}@media(max-width:500px){body{padding:10px}.head{padding:24px 14px 17px}.field{height:260px;margin:0 10px 14px}.stat{min-width:80px;padding:9px 11px}}
</style></head>
<body><main class="wrap"><a class="back" href="home.html">← Voltar ao site oficial</a><section class="card"><header class="head"><div class="tag">ESPECIAL • DIA DAS CRIANÇAS</div><h1>DESAFIO DO <span>CRAQUE MIRIM</span> ⚽</h1><p>Toque na bola o máximo de vezes que conseguir em 20 segundos. Bora mostrar talento!</p><div class="stats" aria-live="polite"><div class="stat">PONTOS<strong id="score">0</strong></div><div class="stat">TEMPO<strong><span id="time">20</span>s</strong></div><div class="stat">RECORDE<strong id="best">0</strong></div></div></header><div class="field" id="field" aria-label="Campo do jogo. Toque na bola para marcar pontos"><button id="ball" aria-label="Toque na bola para marcar ponto" disabled>⚽</button></div><div class="message" id="message" role="status">Toque em “Começar jogo” para jogar!</div><div class="controls"><button class="action" id="start">Começar jogo</button><button class="action secondary" id="reset">Reiniciar</button></div></section><footer>Seleção de Baixa Grande • Bahia</footer></main>
<script>
const field=document.getElementById('field'),ball=document.getElementById('ball'),start=document.getElementById('start'),reset=document.getElementById('reset'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),message=document.getElementById('message');let score=0,time=20,timer=null,playing=false,best=0;
function moveBall(){const x=Math.max(0,field.clientWidth-ball.offsetWidth-24),y=Math.max(0,field.clientHeight-ball.offsetHeight-24);ball.style.left=(12+Math.random()*x)+'px';ball.style.top=(12+Math.random()*y)+'px'}
function finish(){playing=false;clearInterval(timer);timer=null;ball.disabled=true;start.textContent='Jogar novamente';best=Math.max(best,score);bestEl.textContent=best;message.textContent=score>=15?'CRAQUE DEMAIS! Você é fera! 🏆':score>=8?'Boa partida! Você mandou muito bem! ⭐':'Bom jogo! Tente de novo e bata seu recorde! ⚽'}
function begin(){clearInterval(timer);score=0;time=20;playing=true;scoreEl.textContent=score;timeEl.textContent=time;message.textContent='Valendo! Toque na bola!';ball.disabled=false;start.textContent='Jogo em andamento';moveBall();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}
ball.addEventListener('click',()=>{if(!playing)return;score++;scoreEl.textContent=score;message.textContent=score>=15?'Craque mirim em ação! Continue!':'Boa! Continue tocando na bola!';moveBall()});start.addEventListener('click',()=>{if(!playing)begin()});reset.addEventListener('click',()=>{clearInterval(timer);timer=null;playing=false;score=0;time=20;scoreEl.textContent='0';timeEl.textContent='20';ball.disabled=true;ball.style.left='calc(50% - 27px)';ball.style.top='calc(50% - 27px)';start.textContent='Começar jogo';message.textContent='Toque em “Começar jogo” para jogar!'});
</script></body></html>
