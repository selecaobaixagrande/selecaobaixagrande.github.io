<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070809"><title>Treinos | SOIT</title><link rel="stylesheet" href="soit-modulo.css"></head><body><div class="app"><header class="top"><div class="brand"><img src="1000001685.png"><div><b>SOIT · SELEÇÃO DE BAIXA GRANDE</b><span>PLANEJAMENTO DE TREINOS</span></div></div><div class="pill" id="profilePill">RAMON</div></header><main class="wrap"><button class="back" data-back>← Voltar ao painel</button><section class="hero"><div><div class="kicker">COMISSÃO TÉCNICA</div><h1>Treinos</h1><p>Planeje data, horário, local, categoria, objetivo e observações.</p></div></section><section class="panel"><div class="panelTitle">Novo treino</div><div class="filters"><label class="field"><small>DATA</small><input id="date" type="date"></label><label class="field"><small>HORÁRIO</small><input id="time" type="time"></label><label class="field"><small>LOCAL</small><input id="place" placeholder="Local do treino"></label><label class="field"><small>CATEGORIA</small><select id="cat"><option>Sub-13</option><option>Sub-15</option><option>Sub-17</option><option>Sub-20</option></select></label></div><div class="field" style="margin-top:10px"><small>OBJETIVO</small><input id="objective" placeholder="Objetivo do treino"></div><div class="field" style="margin-top:10px"><small>OBSERVAÇÕES</small><textarea id="obs" rows="3" placeholder="Observações"></textarea></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="saveTrain">Salvar treino</button></div></section><section class="panel"><div class="panelTitle">Treinos cadastrados</div><div class="list" id="list"></div></section><div id="toast" class="toast"></div></main></div><script src="soit-modulo.js"></script><script>(function(){const K='soit_treinos';let arr=JSON.parse(localStorage.getItem(K)||'[]');function render(){list.innerHTML=arr.map((x,i)=>'<div class="row"><div><strong>'+x.date+' · '+x.time+' · '+x.cat+'</strong><small>'+x.place+' · '+x.objective+'</small></div><button class="btn" onclick="removeTrain('+i+')">Excluir</button></div>').join('')||'<div class="note">Nenhum treino cadastrado.</div>'}window.removeTrain=i=>{arr.splice(i,1);localStorage.setItem(K,JSON.stringify(arr));render()};saveTrain.onclick=()=>{arr.unshift({date:date.value,time:time.value,place:place.value,cat:cat.value,objective:objective.value,obs:obs.value});localStorage.setItem(K,JSON.stringify(arr));render();soitToast('Treino salvo')};render()})();</script></body></html>
