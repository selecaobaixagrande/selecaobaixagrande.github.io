<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar Escalações</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:25px 16px}.card{background:#111;border:1px solid #292929;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;background:#080808;color:#fff;border:1px solid #333;border-radius:8px}label{font-size:12px;color:#aaa;display:block;margin-bottom:6px}button,a{padding:11px 15px;border:0;border-radius:8px;background:#b5121b;color:#fff;font-weight:bold;text-decoration:none;cursor:pointer}.sec{background:#292929}.full{grid-column:1/-1}.muted,.ajuda{color:#999;font-size:12px}.erro{display:none;background:#2a0d0f;color:#ff9da3;padding:12px;border-radius:8px}.item{border-top:1px solid #292929;padding:14px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}button,a{width:100%;box-sizing:border-box;display:block;text-align:center}}</style></head><body><main><div class="card"><div class="muted">COMISSÃO TÉCNICA</div><h1>📋 Gerenciar escalações</h1><p class="muted">Monte e publique a escalação da partida.</p><a class="sec" href="painel-treinador.html">← Painel</a></div><div id="erro" class="erro"></div><div class="card"><h2>Nova escalação</h2><div class="grid"><div><label>Jogo *</label><select id="jogo"><option value="">Carregando...</option></select></div><div><label>Formação *</label><input id="formacao" placeholder="Ex.: 4-3-3, 4-2-3-1, 3-5-2"><div class="ajuda">Escreva a formação que você quiser.</div></div><div class="full"><label>11 titulares — um nome por linha</label><textarea id="titulares" rows="11" placeholder="Jogador 1&#10;Jogador 2&#10;Jogador 3&#10;Jogador 4&#10;Jogador 5&#10;Jogador 6&#10;Jogador 7&#10;Jogador 8&#10;Jogador 9&#10;Jogador 10&#10;Jogador 11"></textarea></div><div class="full"><label>Reservas — um nome por linha</label><textarea id="reservas" rows="5"></textarea></div><div><label>Capitão</label><input id="capitao" placeholder="Nome do capitão"></div><div><label>Publicação</label><select id="publicada"><option value="true">📢 Publicar agora</option><option value="false">📝 Salvar como rascunho</option></select></div></div><br><button id="salvar">💾 Salvar escalação</button></div><div class="card"><h2>Escalações salvas</h2><div id="lista">Carregando...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY');const $=x=>document.getElementById(x);function erro(x){$('erro').textContent=x;$('erro').style.display='block'}async function jogos(){const r=await sb.from('jogos').select('id,adversario,data_jogo').order('data_jogo',{ascending:false});if(r.error)return erro('Erro ao carregar jogos: '+r.error.message);$('jogo').innerHTML='<option value="">Selecione uma partida</option>'+(r.data||[]).map(j=>`<option value="${j.id}">BAIXA GRANDE x ${j.adversario||'Adversário'} — ${j.data_jogo||''}</option>`).join('')}async function carregar(){const r=await sb.from('escalacoes').select('*').order('criado_em',{ascending:false});if(r.error){$('lista').textContent='Não foi possível carregar as escalações.';return}$('lista').innerHTML=(r.data||[]).map(e=>`<div class="item"><b>${e.formacao||'Formação não informada'}</b><div class="muted">Jogo: ${e.jogo_id} • ${e.publicada?'Publicada':'Rascunho'}</div></div>`).join('')||'<span class="muted">Nenhuma escalação cadastrada.</span>'}$('salvar').onclick=async()=>{ $('erro').style.display='none'; const titulares=$('titulares').value.split('\n').map(x=>x.trim()).filter(Boolean); const formacao=$('formacao').value.trim(); if(!$('jogo').value)return erro('Selecione uma partida.'); if(!formacao)return erro('Digite a formação.'); if(titulares.length!==11)return erro('Informe exatamente 11 titulares, um por linha.'); const reservas=$('reservas').value.split('\n').map(x=>x.trim()).filter(Boolean); const r=await sb.from('escalacoes').insert({jogo_id:$('jogo').value,formacao,titulares,reservas,capitao:$('capitao').value.trim()||null,publicada:$('publicada').value==='true'}); if(r.error)return erro('Não foi possível salvar: '+r.error.message); alert('Escalação salva com sucesso!');$('formacao').value='';$('titulares').value='';$('reservas').value='';$('capitao').value='';carregar()};jogos();carregar()</script></body></html>
