<text x="92" y="112" fill="#ff5962" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="5">12 DE OUTUBRO  •  SELEÇÃO DE BAIXA GRANDE</text>
<text x="84" y="218" fill="#fff" font-family="Arial,sans-serif" font-size="72" font-weight="900" letter-spacing="-2">FELIZ DIA DAS</text>
<text x="75" y="310" fill="#ed2733" font-family="Arial,sans-serif" font-size="104" font-weight="900" letter-spacing="-3">CRIANÇAS!</text>
<path d="M89 333Q280 348 550 324" fill="none" stroke="#ed2733" stroke-width="8" stroke-linecap="round"/>
<text x="95" y="390" fill="#f1f1f1" font-family="Arial,sans-serif" font-size="24">Que nunca faltem alegria, carinho,</text>
<text x="95" y="425" fill="#f1f1f1" font-family="Arial,sans-serif" font-size="24">oportunidades e sonhos para realizar.</text>
<text x="95" y="482" fill="#d5d5d5" font-family="Arial,sans-serif" font-size="19">O futuro também joga com eles. ⚽</text>
<text x="95" y="550" fill="url(#gold)" font-family="Arial,sans-serif" font-size="22" font-weight="700">COM CARINHO, SELEÇÃO DE BAIXA GRANDE</text>
