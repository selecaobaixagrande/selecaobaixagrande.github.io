<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
<title id="title">Feliz Dia das Crianças — Seleção de Baixa Grande</title><desc id="desc">Arte comemorativa com cores preto, vermelho e dourado, crianças jogando futebol ao pôr do sol.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090b"/><stop offset=".58" stop-color="#171014"/><stop offset="1" stop-color="#35080d"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#ffdca0" stop-opacity=".92"/><stop offset="1" stop-color="#ef2733" stop-opacity="0"/></radialGradient>
 <linearGradient id="jersey" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27282b"/><stop offset="1" stop-color="#070809"/></linearGradient>
 <linearGradient id="gold"><stop stop-color="#ffe5a0"/><stop offset="1" stop-color="#d29a35"/></linearGradient>
 <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M0 14H80M0 55H80" stroke="#fff" stroke-opacity=".025"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1600" height="680" fill="url(#bg)"/><rect width="1600" height="680" fill="url(#grain)"/>
<circle cx="1240" cy="245" r="265" fill="url(#sun)"/><circle cx="1240" cy="245" r="120" fill="#ffc977" opacity=".15" filter="url(#glow)"/>
