<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login do Treinador | Seleção de Baixa Grande</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#070707;color:#fff}.topo{padding:18px max(20px,calc((100% - 1180px)/2));background:rgba(7,7,7,.9);border-bottom:1px solid #292b2f}.topo a{color:#aaa;text-decoration:none;font-size:13px;font-weight:800}.area{min-height:calc(100vh - 155px);display:flex;justify-content:center;align-items:center;padding:45px 18px;background:radial-gradient(circle at 50% 15%,rgba(181,18,27,.22),transparent 45%),#070707}.caixa{width:100%;max-width:450px;padding:38px;background:linear-gradient(145deg,#17181b,#0d0e10);border:1px solid #303238;border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.5)}.logo{width:92px;height:92px;object-fit:contain;display:block;margin:0 auto 22px}.eyebrow{text-align:center;color:#ff5660;font-size:10px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase}h2{text-align:center;font-size:30px;margin:8px 0}.sub{text-align:center;color:#8f9298;font-size:13px;margin:0 0 28px}.campo{margin-bottom:17px}.campo label{display:block;font-size:12px;font-weight:850;margin-bottom:7px}.campo input{width:100%;padding:14px 15px;border-radius:11px;border:1px solid #33363b;background:#08090a;color:#fff;outline:none;font-size:15px}.campo input:focus{border-color:#b5121b}.btn{width:100%;min-height:50px;border:1px solid #ed2733;border-radius:11px;background:#b5121b;color:#fff;font-weight:900;font-size:14px;cursor:pointer}.btn:disabled{opacity:.6}.mensagem{display:none;margin-top:15px;padding:12px;border-radius:10px;text-align:center;font-size:12px}.mensagem.erro{display:block;background:#2a0d0f;border:1px solid #7d1d25;color:#ff9da3}.mensagem.sucesso{display:block;background:#0d2415;border:1px solid #236b38;color:#8ee6a6}.link{display:block;text-align:center;margin-top:19px;color:#85888e;text-decoration:none;font-size:12px}footer{text-align:center;padding:25px 20px;background:#050505;border-top:1px solid #292b2f;color:#777;font-size:12px}footer p{margin:5px}footer strong{color:#fff}@media(max-width:500px){.caixa{padding:30px 20px}h2{font-size:26px}}</style></head><body><div class="topo"><a href="atleta.html">← Voltar para área de acesso</a></div><main><section class="area"><div class="caixa"><img src="1000001685.png" alt="Escudo da Seleção de Baixa Grande" class="logo"><div class="eyebrow">ÁREA DO TREINADOR</div><h2>Painel da comissão</h2><p class="sub">Acesse ferramentas de gestão e acompanhamento da Seleção.</p><form id="loginForm"><div class="campo"><label for="email">E-mail</label><input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="username" required></div><div class="campo"><label for="senha">Senha</label><input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required></div><button type="submit" class="btn" id="btnLogin">ENTRAR NO PAINEL</button></form><div id="mensagem" class="mensagem"></div><a href="atleta.html" class="link">← Voltar para escolha de acesso</a></div></section></main><footer><p><strong>⚽ SELEÇÃO DE BAIXA GRANDE</strong></p><p>Baixa Grande - Bahia • © 2026</p></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const URL='https://lvxwziztdngntoqypzga.supabase.co',KEY='sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY',sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),form=document.getElementById('loginForm'),msg=document.getElementById('mensagem'),btn=document.getElementById('btnLogin');const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('O servidor não respondeu. Tente novamente.')),ms))]);function show(t,c){msg.textContent=t;msg.className='mensagem '+c}form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),senha=document.getElementById('senha').value;if(!email||!senha)return show('Digite seu e-mail e sua senha.','erro');btn.disabled=true;btn.textContent='ENTRANDO...';show('Verificando seus dados...','sucesso');try{const r=await timeout(sb.auth.signInWithPassword({email,password:senha}),8000);if(r.error)throw new Error('E-mail ou senha incorretos.');const session=r.data?.session,user=r.data?.user;if(!session||!user)throw new Error('Login realizado, mas a sessão não foi criada. Tente novamente.');const p=await timeout(sb.from('Perfis').select('Id,Email,Tipo,Text').ilike('Email',email).maybeSingle(),7000);if(p.error)throw new Error('Não foi possível validar o perfil do treinador: '+p.error.message);if(!p.data){await sb.auth.signOut();throw new Error('Sua conta não possui um perfil de treinador cadastrado.');}if(String(p.data.Tipo||'').trim().toLowerCase()!=='treinador'){await sb.auth.signOut();throw new Error('Esta conta não está cadastrada como treinador.');}show('Login realizado! Abrindo seu painel...','sucesso');location.href='painel-treinador.html'}catch(err){console.error(err);show(err.message||'Não foi possível entrar.','erro');btn.disabled=false;btn.textContent='ENTRAR NO PAINEL'}})})();</script></body></html>
