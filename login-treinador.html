<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login do Treinador | Seleção de Baixa Grande</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#080808;color:#fff}.topo{padding:18px 20px;background:#0d0d0d;border-bottom:1px solid #292929}.topo a{color:#aaa;text-decoration:none;font-size:14px;font-weight:bold}.topo a:hover{color:#fff}.area{min-height:calc(100vh - 160px);display:flex;justify-content:center;align-items:center;padding:50px 20px;background:radial-gradient(circle at center,rgba(181,18,27,.30),transparent 55%),#080808}.caixa{width:100%;max-width:430px;padding:35px;background:linear-gradient(145deg,#1c1c1c,#101010);border:1px solid #333;border-top:4px solid #b5121b;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}.logo{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto 20px}h2{text-align:center;font-size:27px;margin:0 0 8px}.sub{text-align:center;color:#999;font-size:14px;margin:0 0 30px}.campo{margin-bottom:18px}.campo label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}.campo input{width:100%;padding:14px;border-radius:9px;border:1px solid #333;background:#080808;color:#fff;outline:none;font-size:15px}.campo input:focus{border-color:#b5121b;box-shadow:0 0 0 2px rgba(181,18,27,.15)}.btn{width:100%;min-height:50px;border:none;border-radius:9px;background:#b5121b;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}.btn:hover{background:#e32632}.btn:disabled{opacity:.6;cursor:not-allowed}.mensagem{display:none;margin-top:15px;padding:12px;border-radius:8px;text-align:center;font-size:13px}.mensagem.erro{display:block;background:#2a0d0f;border:1px solid #7d1d25;color:#ff9da3}.mensagem.sucesso{display:block;background:#0d2415;border:1px solid #236b38;color:#8ee6a6}.link{display:block;text-align:center;margin-top:18px;color:#aaa;text-decoration:none;font- true;botao.textContent="ENTRANDO...";mostrarMensagem("Verificando seus dados...","sucesso");const{data,error}=await supabaseClient.auth.signInWithPassword({email,password:senha});if(error){console.error(error);mostrarMensagem("E-mail ou senha incorretos.","erro");botao.disabled=false;botao.textContent="ENTRAR";return}const user=data.user;if(!user){mostrarMensagem("Não foi possível identificar sua conta.","erro");botao.disabled=false;botao.textContent="ENTRAR";return}let perfil=null,erroPerfil=null;const porId=await supabaseClient.from("Perfis").select("*").eq("id",user.id).maybeSingle();perfil=porId.data;erroPerfil=porId.error;if(!perfil){const porEmail=await supabaseClient.from("Perfis").select("*").eq("Email",user.email).maybeSingle();perfil=porEmail.data;erroPerfil=porEmail.error}if(erroPerfil){console.error(erroPerfil);mostrarMensagem("Não foi possível consultar seu perfil. Verifique as permissões da tabela Perfis.","erro");await supabaseClient.auth.signOut();botao.disabled=false;botao.textContent="ENTRAR";return}if(!perfil){mostrarMensagem("Sua conta não possui um perfil de treinador cadastrado.","erro");await supabaseClient.auth.signOut();botao.disabled=false;botao.textContent="ENTRAR";return}const tipo=String(perfil.Tipo||perfil.tipo||"").trim().toLowerCase();if(tipo!=="treinador"){mostrarMensagem("Esta conta não está cadastrada como treinador.","erro");await supabaseClient.auth.signOut();botao.disabled=false;botao.textContent="ENTRAR";return}mostrarMensagem("Login realizado! Abrindo seu painel...","sucesso");setTimeout(()=>location.href="painel-treinador.html",800)});</script></body></html>
