<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070809"><title>Presença no treino | SOIT</title><link rel="stylesheet" href="soit-modulo.css"></head><body><div class="app"><header class="top"><div class="brand"><img src="1000001685.png"><div><b>SOIT · SELEÇÃO DE BAIXA GRANDE</b><span>PRESENÇA NO TREINO</span></div></div><div class="pill" id="profilePill">RAMON</div></header><main class="wrap"><button class="back" data-back>← Voltar ao painel</button><section class="hero"><div><div class="kicker">GESTÃO DE TREINOS</div><h1>Presença no treino</h1><p>Registre presente, falta, justificativa ou atendimento médico.</p></div><div class="actions"><button class="btn primary" id="savePresence">Salvar presença</button></div></section><section class="panel"><div class="filters"><label class="field"><small>CATEGORIA</small><select id="cat"><option>Sub-13</option><option>Sub-15</option><option>Sub-17</option><option>Sub-20</option></select></label><label class="field"><small>GRUPO</small><select id="grp"><option>Grupo A</option><option>Grupo B</option></select></label><label class="field"><small>DATA</small><input id="date" type="date"></label></div></section><section class="panel"><div class="panelTitle">Situação dos atletas</div><div class="note">Marque a situação de cada atleta. A alteração fica disponível imediatamente na tela.</div><div class="athletes" id="athletes"></div></section><div id="toast" class="toast"></div></main></div><script src="soit-modulo.js"></script><script>(function(){const names=['Gabriel Rios Fernandes','Vinícius Alves Pinho','Rian Pedreira Lima','Nycolas Santana Silva','Miguel Santos Oliveira','Willyam Kervem da Silva','Henrique Oliveira Santos','Davi Lucas Santana de Jesus','Lázaro Pessoa Rodrigues','Rafael Almeida da Silva'];const key=()=> 'soit_pres_'+date.value+'_'+cat.value+'_'+grp.value;date.value=new Date().toISOString().slice(0,10);let data=JSON.parse(localStorage.getItem(key())||'{}');function render(){athletes.innerHTML=names.map((n,i)=>{let s=data[i]||'';return '<div class="ath"><div><strong>'+n+'</strong><small>'+cat.value+' · '+grp.value+'</small></div><div class="status">'+[['P','presente'],['F','falta'],['J','justificada'],['DM','medico']].map(x=>'<button type="button" data-i="'+i+'" data-s="'+x[1]+'" class="'+(s===x[1]?'on':'')+'">'+x[0]+'</button>').join('')+'</div></div>'}).join('')}document.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;data[b.dataset.i]=b.dataset.s;render()});function reload(){data=JSON.parse(localStorage.getItem(key())||'{}');render()}[cat,grp,date].forEach(x=>x.addEventListener('change',reload));savePresence.onclick=()=>{localStorage.setItem(key(),JSON.stringify(data));soitToast('Presença salva neste dispositivo')};render()})();</script></body></html>
