<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070809"><title>Presença no treino | SOIT</title><link rel="stylesheet" href="soit-modulo.css"></head><body><div class="app"><header class="top"><div class="brand"><img src="1000001685.png"><div><b>SOIT · SELEÇÃO DE BAIXA GRANDE</b><span>PRESENÇA NO TREINO</span></div></div><div class="pill" id="profilePill">RAMON</div></header><main class="wrap"><button class="back" data-back>← Voltar ao painel</button><section class="hero"><div><div class="kicker">GESTÃO DE TREINOS</div><h1>Presença no treino</h1><p>Registre presente, falta, justificativa ou atendimento médico.</p></div><div class="actions"><button class="btn primary" id="savePresence">Salvar presença</button></div></section><section class="panel"><div class="filters"><label class="field"><small>CATEGORIA</small><select id="cat"><option>Sub-13</option><option>Sub-15</option><option>Sub-17</option><option>Sub-20</option></select></label><label class="field"><small>GRUPO</small><select id="grp"><option>Grupo A</option><option>Grupo B</option></select></label><label class="field"><small>DATA</small><input id="date" type="date"></label></div></section><section class="panel"><div class="panelTitle">Situação dos atletas</div><div class="note">Marque a situação de cada atleta. A alteração fica disponível imediatamente na tela.</div><div class="athletes" id="athletes"></div></section><div id="toast" class="toast"></div></main></div><script src="soit-modulo.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async function(){const sb=supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY');let names=[];date.value=new Date().toISOString().slice(0,10);async function load(){const cats=await sb.from('categorias_app').select('id,nome').eq('ativo',true).order('nome');const chosen=(cats.data||[]).find(x=>x.nome===cat.value);const groups=chosen?await sb.from('grupos_app').select('id,nome').eq('categoria_id',chosen.id).eq('ativo',true).order('nome'):{data:[]};grp.innerHTML=(groups.data||[]).map(x=>'<option>'+x.nome+'</option>').join('');if(!grp.value){names=[];render();return}const g=(groups.data||[]).find(x=>x.nome===grp.value);const links=await sb.from('grupo_atletas_app').select('atleta_id').eq('grupo_id',g.id).eq('ativo',true);const ids=(links.data||[]).map(x=>x.atleta_id);const ar=ids.length?await sb.from('Atletas').select('id,nome').in('id',ids).eq('status','Ativo').order('nome'):{data:[]};names=ar.data||[];render()}let data={};function key(){return 'soit_pres_'+date.value+'_'+cat.value+'_'+grp.value}function render(){athletes.innerHTML=names.map((a,i)=>{const s=data[a.id]||'';return '<div class="ath"><div><strong>'+a.nome+'</strong><small>'+cat.value+' · '+grp.value+'</small></div><div class="status">'+[['P','presente'],['F','falta'],['J','justificada'],['DM','medico']].map(x=>'<button type="button" data-i="'+a.id+'" data-s="'+x[1]+'" class="'+(s===x[1]?'on':'')+'">'+x[0]+'</button>').join('')+'</div></div>'}).join('')||'<div class="note">Nenhum atleta encontrado.</div>'}document.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;data[b.dataset.i]=b.dataset.s;render()});async function reload(){data=JSON.parse(localStorage.getItem(key())||'{}');await load()}[cat,grp,date].forEach(x=>x.addEventListener('change',reload));savePresence.onclick=()=>{localStorage.setItem(key(),JSON.stringify(data));soitToast('Presença salva neste dispositivo')};cat.innerHTML='<option>Sub-13</option><option>Sub-15 / Sub-17</option>';grp.innerHTML='<option>Grupo A</option><option>Grupo B</option>';await load()})();</script></body></html>
