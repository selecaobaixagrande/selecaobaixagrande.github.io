<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070809"><title>Presença no treino | SOIT</title><link rel="stylesheet" href="soit-modulo.css"><style>
.groupPicker{position:fixed;inset:0;z-index:9999;display:none}.groupPicker.open{display:block}.groupPickerBack{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}.groupPickerCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 28px));max-height:78vh;overflow:auto;background:#101315;border:1px solid #3a4145;border-radius:22px;padding:18px;box-shadow:0 30px 90px #000}.groupPickerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.groupPickerHead b{font-size:16px}.groupPickerClose{border:1px solid #3b4245;background:#171b1d;color:#fff;border-radius:10px;width:38px;height:38px;font-size:22px}.groupList{display:grid;gap:9px}.groupOption{width:100%;text-align:left;border:1px solid #343b3f;background:#15191b;color:#fff;border-radius:14px;padding:15px;cursor:pointer}.groupOption:active{transform:scale(.99)}.groupOption strong{display:block;font-size:13px}.groupOption small{display:block;color:#899397;font-size:9px;margin-top:4px}.groupButton{width:100%;text-align:left;position:relative}.groupButton .groupValue{display:block;font-size:16px;color:#fff;padding-right:24px}.groupButton .groupArrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:22px;color:#c9ced0}.groupEmpty{padding:14px;border:1px solid #412126;border-radius:13px;color:#aab1b4;background:#190e10;font-size:10px}
</style></head><body><div class="app"><header class="top"><div class="brand"><img src="1000001685.png"><div><b>SOIT · SELEÇÃO DE BAIXA GRANDE</b><span>PRESENÇA NO TREINO</span></div></div><div class="pill" id="profilePill">RAMON</div></header><main class="wrap"><button class="back" data-back>← Voltar ao painel</button><section class="hero"><div><div class="kicker">GESTÃO DE TREINOS</div><h1>Presença no treino</h1><p>Registre presente, falta, justificativa ou atendimento médico.</p></div><div class="actions"><button class="btn primary" id="savePresence">Salvar presença</button></div></section><section class="panel"><div class="filters"><label class="field"><small>CATEGORIA</small><select id="cat"></select></label><div class="field"><small>GRUPO</small><button type="button" class="control groupButton" id="groupButton"><span class="groupValue" id="groupValue">Escolher grupo</span><span class="groupArrow">⌄</span></button></div><label class="field"><small>DATA</small><input id="date" type="date"></label></div></section><section class="panel"><div class="panelTitle">Situação dos atletas</div><div class="note">Escolha um grupo para carregar os atletas e registrar a frequência.</div><div class="athletes" id="athletes"><div class="groupEmpty">Nenhum grupo selecionado.</div></div></section><div id="toast" class="toast"></div></main><div id="groupPicker" class="groupPicker" aria-hidden="true"><div class="groupPickerBack" id="groupPickerBack"></div><div class="groupPickerCard"><div class="groupPickerHead"><b>Escolher grupo</b><button type="button" class="groupPickerClose" id="groupPickerClose">×</button></div><div id="groupList" class="groupList"></div></div></div></div><script src="soit-modulo.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async function(){
'use strict';
const sb=supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY');
const catEl=document.getElementById('cat'), groupBtn=document.getElementById('groupButton'), groupValue=document.getElementById('groupValue'), groupPicker=document.getElementById('groupPicker'), groupList=document.getElementById('groupList'), athletesEl=document.getElementById('athletes'), dateEl=document.getElementById('date'), saveBtn=document.getElementById('savePresence');
let categories=[],groups=[],selectedCategory=null,selectedGroup=null,names=[],data={};
dateEl.value=new Date().toISOString().slice(0,10);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openGroups(){groupPicker.classList.add('open');groupPicker.setAttribute('aria-hidden','false')}
function closeGroups(){groupPicker.classList.remove('open');groupPicker.setAttribute('aria-hidden','true')}
function storageKey(){return 'soit_pres_'+dateEl.value+'_'+(selectedCategory?.id||'')+'_'+(selectedGroup?.id||'')}
function render(){athletesEl.innerHTML=names.length?names.map(a=>{const s=data[a.id]||'';return '<div class="ath"><div><strong>'+esc(a.nome)+'</strong><small>'+esc(selectedCategory?.nome||'')+' · '+esc(selectedGroup?.nome||'')+'</small></div><div class="status">'+[['P','presente'],['F','falta'],['J','justificada'],['DM','medico']].map(x=>'<button type="button" data-i="'+esc(a.id)+'" data-s="'+x[1]+'" class="'+(s===x[1]?'on':'')+'">'+x[0]+'</button>').join('')+'</div></div>'}).join(''):'<div class="groupEmpty">'+(selectedGroup?'Nenhum atleta encontrado neste grupo.':'Nenhum grupo selecionado.')+'</div>'}
async function loadGroups(){
const r=await sb.from('grupos_app').select('id,nome,categoria_id,ativo').eq('categoria_id',selectedCategory.id).eq('ativo',true).order('nome');
groups=r.data||[];
groupList.innerHTML=groups.length?groups.map(g=>'<button type="button" class="groupOption" data-group="'+esc(g.id)+'"><strong>'+esc(g.nome)+'</strong><small>Selecionar este grupo</small></button>').join(''):'<div class="groupEmpty">Nenhum grupo cadastrado para esta categoria.</div>';
if(!groups.some(g=>String(g.id)===String(selectedGroup?.id))){selectedGroup=null;groupValue.textContent='Escolher grupo';names=[];render()}
}
async function loadAthletes(){
if(!selectedGroup){names=[];render();return}
const links=await sb.from('grupo_atletas_app').select('atleta_id').eq('grupo_id',selectedGroup.id).eq('ativo',true);
const ids=(links.data||[]).map(x=>x.atleta_id);
if(!ids.length){names=[];render();return}
const ar=await sb.from('Atletas').select('id,nome,status').in('id',ids).order('nome');
names=(ar.data||[]).filter(a=>String(a.status||'Ativo').trim().toLowerCase()==='ativo');
data=JSON.parse(localStorage.getItem(storageKey())||'{}');
render();
}
async function init(){
const cr=await sb.from('categorias_app').select('id,nome,ativo').eq('ativo',true).order('nome');
categories=cr.data||[];
catEl.innerHTML=categories.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.nome)+'</option>').join('');
if(!categories.length){catEl.innerHTML='<option>Sem categorias</option>';return}
const savedCat=localStorage.getItem('soit_presence_category_id');
selectedCategory=categories.find(c=>String(c.id)===String(savedCat))||categories[0];
catEl.value=selectedCategory.id;
await loadGroups();
const savedGroup=localStorage.getItem('soit_presence_group_id');
selectedGroup=groups.find(g=>String(g.id)===String(savedGroup))||null;
if(selectedGroup){groupValue.textContent=selectedGroup.nome;await loadAthletes()}else render();
}
catEl.addEventListener('change',async()=>{selectedCategory=categories.find(c=>String(c.id)===String(catEl.value))||null;localStorage.setItem('soit_presence_category_id',selectedCategory?.id||'');selectedGroup=null;localStorage.removeItem('soit_presence_group_id');groupValue.textContent='Escolher grupo';names=[];render();await loadGroups()});
groupBtn.addEventListener('click',openGroups);
document.getElementById('groupPickerBack').addEventListener('click',closeGroups);
document.getElementById('groupPickerClose').addEventListener('click',closeGroups);
groupList.addEventListener('click',async e=>{const b=e.target.closest('[data-group]');if(!b)return;selectedGroup=groups.find(g=>String(g.id)===String(b.dataset.group))||null;if(!selectedGroup)return;localStorage.setItem('soit_presence_group_id',selectedGroup.id);groupValue.textContent=selectedGroup.nome;closeGroups();data=JSON.parse(localStorage.getItem(storageKey())||'{}');await loadAthletes()});
dateEl.addEventListener('change',async()=>{data=JSON.parse(localStorage.getItem(storageKey())||'{}');render()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;data[b.dataset.i]=b.dataset.s;render()});
saveBtn.addEventListener('click',()=>{localStorage.setItem(storageKey(),JSON.stringify(data));soitToast('Presença salva neste dispositivo')});
await init();
})();
</script></body></html>
