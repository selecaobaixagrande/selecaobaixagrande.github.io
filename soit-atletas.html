<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070809"><title>Atletas | SOIT</title><link rel="stylesheet" href="soit-modulo.css"></head><body><div class="app"><header class="top"><div class="brand"><img src="1000001685.png"><div><b>SOIT · SELEÇÃO DE BAIXA GRANDE</b><span>GESTÃO DO ELENCO</span></div></div><div class="pill" id="profilePill">RAMON</div></header><main class="wrap"><button class="back" data-back>← Voltar ao painel</button><section class="hero"><div><div class="kicker">ELENCO</div><h1>Atletas</h1><p>Consulta organizada por categoria e grupo.</p></div></section><section class="panel"><div class="filters"><label class="field"><small>CATEGORIA</small><select id="cat"><option>Sub-13</option><option>Sub-15</option><option>Sub-17</option><option>Sub-20</option></select></label><label class="field"><small>GRUPO</small><div id="groupPicker" class="choice-row"><button type="button" class="btn group-btn active" data-group="Grupo A">Grupo A</button><button type="button" class="btn group-btn" data-group="Grupo B">Grupo B</button></div><input id="grp" type="hidden" value="Grupo A"></label><label class="field"><small>BUSCAR</small><input id="search" placeholder="Nome do atleta"></label></div></section><section class="panel"><div class="panelTitle">Elenco selecionado</div><div class="list" id="list"></div></section><div id="toast" class="toast"></div></main></div><script src="soit-modulo.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async function(){const sb=supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY');let rows=[];async function load(){const cats=await sb.from('categorias_app').select('id,nome').eq('ativo',true).order('nome');const chosen=(cats.data||[]).find(x=>x.nome===cat.value);const groups=chosen?await sb.from('grupos_app').select('id,nome').eq('categoria_id',chosen.id).eq('ativo',true).order('nome'):{data:[]};const g=(groups.data||[]).find(x=>x.nome===grp.value);if(!g){rows=[];render();return}const links=await sb.from('grupo_atletas_app').select('atleta_id').eq('grupo_id',g.id).eq('ativo',true);const ids=(links.data||[]).map(x=>x.atleta_id);const ar=ids.length?await sb.from('Atletas').select('id,nome,categoria,posicao,numero_camisa').in('id',ids).eq('status','Ativo').order('nome'):{data:[]};rows=ar.data||[];render()}function render(){const s=search.value.toLowerCase();list.innerHTML=rows.filter(x=>x.nome.toLowerCase().includes(s)).map(x=>'<div class="row"><div><strong>'+x.nome+'</strong><small>'+x.categoria+' · '+(x.posicao||'Posição não informada')+(x.numero_camisa?' · #'+x.numero_camisa:'')+'</small></div></div>').join('')||'<div class="note">Nenhum atleta encontrado.</div>'}cat.innerHTML='<option>Sub-13</option><option>Sub-15 / Sub-17</option>';grp.innerHTML='<option>Grupo A</option><option>Grupo B</option>';search.oninput=render;cat.onchange=load;document.getElementById('groupPicker').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(!b)return;grp.value=b.dataset.group;document.querySelectorAll('.group-btn').forEach(x=>x.classList.toggle('active',x===b));load()});load()})();</script></body></html>
