<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070809"><title>Carga física RPE | SOIT</title><link rel="stylesheet" href="soit-modulo.css"></head><body><div class="app"><header class="top"><div class="brand"><img src="1000001685.png"><div><b>SOIT · SELEÇÃO DE BAIXA GRANDE</b><span>CARGA FÍSICA · RPE</span></div></div><div class="pill" id="profilePill">RAMON</div></header><main class="wrap"><button class="back" data-back>← Voltar ao painel</button><section class="hero"><div><div class="kicker">PREPARAÇÃO FÍSICA</div><h1>Carga física · RPE</h1><p>Registre a percepção de esforço do treino em escala de 0 a 10.</p></div></section><section class="panel"><div class="filters"><label class="field"><small>ATLETA</small><select id="ath"><option>Gabriel Rios Fernandes</option><option>Vinícius Alves Pinho</option><option>Rian Pedreira Lima</option><option>Nycolas Santana Silva</option></select></label><label class="field"><small>DATA</small><input id="date" type="date"></label></div><div class="panelTitle" style="margin-top:18px">RPE</div><div class="choices" id="choices"></div><div class="note" style="margin-top:15px">0 = repouso · 1–3 = leve · 4–6 = moderado · 7–8 = alto · 9–10 = máximo.</div><div class="actions" style="margin-top:15px"><button class="btn primary" id="save">Salvar RPE</button></div></section><section class="panel"><div class="panelTitle">Últimos registros</div><div class="list" id="list"></div></section><div id="toast" class="toast"></div></main></div><script src="soit-modulo.js"></script><script>(function(){const K='soit_rpe';let a=JSON.parse(localStorage.getItem(K)||'[]'),sel=null;date.value=new Date().toISOString().slice(0,10);choices.innerHTML=Array.from({length:11},(_,i)=>'<button class="choice" data-r="'+i+'">'+i+'</button>').join('');choices.onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;sel=+b.dataset.r;document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('on'));b.classList.add('on')};save.onclick=()=>{if(sel===null)return soitToast('Selecione o RPE');a.unshift({ath:ath.value,date:date.value,rpe:sel});localStorage.setItem(K,JSON.stringify(a));render();soitToast('RPE salvo')};function render(){list.innerHTML=a.slice(0,10).map(x=>'<div class="row"><div><strong>'+x.ath+'</strong><small>'+x.date+'</small></div><b class="metric">'+x.rpe+'</b></div>').join('')||'<div class="note">Nenhum registro.</div>'}render()})();</script></body></html>
