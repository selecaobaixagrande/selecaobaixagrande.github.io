<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login do Atleta | Seleção de Baixa Grande</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
}

.container{
    width:100%;
    max-width:420px;
}

.logo-area{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:90px;
    height:90px;
    object-fit:contain;
    margin-bottom:12px;
}

.logo-area h1{
    margin:0;
    font-size:23px;
}

.logo-area span{
    color:#b5121b;
}

.logo-area p{
    margin-top:8px;
    color:#888;
    font-size:13px;
}

.card{
    background:#111;
    border:1px solid #292929;
    border-radius:16px;
    padding:28px;
}

.card h2{
    margin:0 0 8px;
    font-size:22px;
}

.card .descricao{
    margin:0 0 25px;
    color:#888;
    font-size:13px;
}

.campo{
    margin-bottom:17px;
}

.campo label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:bold;
}

.campo input{
    width:100%;
    padding:14px;
    border-radius:8px;
    border:1px solid #333;
    background:#080808;
    color:#fff;
    outline:none;
    font-size:14px;
}

.campo input:focus{
    border-color:#b5121b;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#b5121b;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:#e32632;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.mensagem{
    display:none;
    margin-bottom:18px;
    padding:13px;
    border-radius:8px;
    font-size:13px;
}

.mensagem.erro{
    display:block;
    background:#2a0d0f;
    border:1px solid #7d1d25;
    color:#ff9da3;
}

.mensagem.sucesso{
    display:block;
    background:#0d2415;
    border:1px solid #236b38;
    color:#8ee6a6;
}

.mensagem.info{
    display:block;
    background:#111b2a;
    border:1px solid #29476b;
    color:#9ecbff;
}

.voltar{
    display:block;
    margin-top:20px;
    text-align:center;
    color:#888;
    text-decoration:none;
    font-size:13px;
}

.voltar:hover{
    color:#fff;
}

@media(max-width:500px){

    .card{
        padding:22px;
    }

    .logo{
        width:75px;
        height:75px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="logo-area">

        <img
        src="1000001685.png"
        alt="Escudo da Seleção de Baixa Grande"
        class="logo">

        <h1>
            SELEÇÃO DE
            <span>BAIXA GRANDE</span>
        </h1>

        <p>
            Área exclusiva dos atletas
        </p>

    </div>


    <div class="card">

        <h2>
            ⚽ Login do atleta
        </h2>

        <p class="descricao">
            Entre com o e-mail e a senha cadastrados pela equipe.
        </p>


        <div
        id="mensagem"
        class="mensagem">
        </div>


        <form id="formLogin">

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                type="email"
                id="email"
                placeholder="E-mail do atleta"
                autocomplete="email"
                required>

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                type="password"
                id="senha"
                placeholder="Senha do atleta"
                autocomplete="current-password"
                required>

            </div>


            <button
            id="btnEntrar"
            type="submit">

                ENTRAR

            </button>

        </form>


        <a
        href="index.html"
        class="voltar">

            ← Voltar para o site

        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

"use strict";


/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://lvxwziztdngntoqypzga.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =================================
   ELEMENTOS
================================= */

const formLogin =
document.getElementById("formLogin");

const email =
document.getElementById("email");

const senha =
document.getElementById("senha");

const btnEntrar =
document.getElementById("btnEntrar");

const mensagem =
document.getElementById("mensagem");


/* =================================
   MENSAGEM
================================= */

function mostrarMensagem(
    texto,
    tipo
){

    mensagem.textContent =
        texto;

    mensagem.className =
        "mensagem " + tipo;

}


/* =================================
   VERIFICAR SE JÁ ESTÁ LOGADO
================================= */

async function verificarSessao(){

    try{

        const {
            data
        } =
        await supabaseClient
            .auth
            .getSession();


        if(data?.session){

            window.location.href =
                "painel-atleta.html";

        }

    }catch(error){

        console.error(
            "Erro ao verificar sessão:",
            error
        );

    }

}


/* =================================
   LOGIN
================================= */

formLogin.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const emailValor =
            email.value
                .trim()
                .toLowerCase();

        const senhaValor =
            senha.value;


        if(!emailValor){

            mostrarMensagem(
                "Digite seu e-mail.",
                "erro"
            );

            return;

        }


        if(!senhaValor){

            mostrarMensagem(
                "Digite sua senha.",
                "erro"
            );

            return;

        }


        btnEntrar.disabled =
            true;

        btnEntrar.textContent =
            "ENTRANDO...";


        mostrarMensagem(
            "Verificando seus dados...",
            "info"
        );


        try{

            const resultado =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email:
                            emailValor,

                        password:
                            senhaValor

                    });


            if(resultado.error){

                console.error(
                    "Erro no login:",
                    resultado.error
                );


                throw new Error(
                    "E-mail ou senha incorretos."
                );

            }


            if(!resultado.data?.user){

                throw new Error(
                    "Não foi possível identificar o atleta."
                );

            }


            mostrarMensagem(
                "Login realizado! Entrando no painel...",
                "sucesso"
            );


            /*
            =================================
            REDIRECIONAMENTO CORRETO
            =================================
            */

            setTimeout(
                function(){

                    window.location.href =
                        "painel-atleta.html";

                },
                500
            );


        }catch(error){

            console.error(
                "ERRO NO LOGIN:",
                error
            );


            mostrarMensagem(
                error.message ||
                "Não foi possível entrar.",
                "erro"
            );


            btnEntrar.disabled =
                false;

            btnEntrar.textContent =
                "ENTRAR";

        }

    }
);


/* =================================
   INICIAR
================================= */

verificarSessao();

</script>

</body>

    </html>
