<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recursos | Seleção de Baixa Grande</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:25px 15px 60px}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.card{background:#111;border:1px solid #292929;border-radius:14px;padding:18px;margin:16px 0}.muted{color:#999}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#181818;border-radius:12px;padding:18px;text-align:center}.stat b{display:block;font-size:28px}.aviso{border-left:4px solid #b5121b;padding:12px;background:#171717;margin:10px 0}.jogo{padding:13px 0;border-top:1px solid #292929}.tag{display:inline-block;padding:5px 9px;border-radius:15px;background:#2a0d0f;color:#ff9da3;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><div class="muted">SELEÇÃO DE BAIXA GRANDE</div><h1>⚽ Central da Seleção</h1><p class="muted">Agenda, avisos, elenco e próximos jogos.</p></div></div><section class="card"><h2>📢 Avisos</h2><div id="avisos">Carregando...</div></section><section class="card"><h2>👥 Elenco por categoria</h2><div class="grid"><div class="stat"><b id="s13">0</b><span>Sub-13</span></div><div class="stat"><b id="s15">0</b><span>Sub-15</span></div><div class="stat"><b id="s17">0</b><span>Sub-17</span></div><div class="stat"><b id="s20">0</b><span>Sub-20</span></div></div></section><section class="card"><h2>📅 Agenda e jogos</h2><div id="jogos">Carregando...</div></section><section class="card"><h2>📋 Últimas escalações</h2><div id="esc">Carregando...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY');const $=x=>document.getElementById(x);async function carregar(){const a=await sb.from('Atletas').select('*');if(!a.error){const c=x=>x.categoria??x.Categoria??'';['Sub-13','Sub-15','Sub-17','Sub-20'].forEach(x=>$(x==='Sub-13'?'s13':x==='Sub-15'?'s15':x==='Sub-17'?'s17':'s20').textContent=a.data.filter(y=>c(y)===x).length)}const av=await sb.from('avisos').select('*').eq('ativo',true).order('criado_em',{ascending:false});$('avisos').innerHTML=av.data?.length?av.data.map(x=>`<div class="aviso"><b>${x.titulo}</b><div class="muted">${x.texto||''}</div></div>`).join(''):'<p class="muted">Nenhum aviso no momento.</p>';const j=await sb.from('jogos').select('*').order('data_jogo',{ascending:true});$('jogos').innerHTML=j.data?.length?j.data.map(x=>`<div class="jogo"><b>⚽ Baixa Grande x ${x.adversario||'Adversário'}</b><div class="muted">${x.data_jogo||''} • ${x.horario||''} • ${x.local||''}</div><span class="tag">${x.status||'agendado'}</span></div>`).join(''):'<p class="muted">Nenhum jogo cadastrado.</p>';const e=await sb.from('escalacoes').select('*').order('criado_em',{ascending:false}).limit(10);$('esc').innerHTML=e.data?.length?e.data.map(x=>`<div class="jogo"><b>${x.categoria||''} • ${x.formacao||''}</b><div class="muted">Capitão: ${x.capitao||'—'}</div></div>`).join(''):'<p class="muted">Nenhuma escalação publicada.</p>'}carregar();</script></body></html>
