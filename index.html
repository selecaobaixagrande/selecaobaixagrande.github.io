<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Bem-vindo | Seleção de Baixa Grande</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff}body{overflow:hidden}.entrada{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(181,18,27,.34),transparent 38%),linear-gradient(180deg,#111,#050505)}.entrada:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.85));pointer-events:none}.brilho{position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(181,18,27,.18);filter:blur(80px);animation:pulsar 3s ease-in-out infinite}.conteudo{position:relative;z-index:2;width:min(900px,92%);animation:subir 1.2s ease both}.escudo{width:145px;height:145px;object-fit:contain;filter:drop-shadow(0 15px 30px rgba(0,0,0,.7));animation:aparecer 1.1s ease both}.linha{width:70px;height:3px;background:#b5121b;border-radius:5px;margin:22px auto}.mini{font-size:12px;font-weight:bold;letter-spacing:3px;color:#b5121b;text-transform:uppercase}.titulo{font-size:clamp(38px,8vw,76px);line-height:.92;margin:12px 0;font-weight:900;letter-spacing:-3px}.subtitulo{font-size:clamp(16px,3vw,22px);color:#ddd;margin:18px 0 8px}.frase{color:#999;font-size:14px;margin:0 auto;max-width:600px;line-height:1.6}.botoes{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:32px}.btn{border:0;cursor:pointer;text-decoration:none;padding:15px 24px;border-radius:10px;font-weight:bold;font-size:14px;min-width:190px;transition:.25s}.principal{background:#b5121b;color:#fff;box-shadow:0 10px 25px rgba(181,18,27,.25)}.btn:hover{transform:translateY(-3px)}.rodape{position:absolute;bottom:20px;left:0;right:0;color:#666;font-size:11px;z-index:2}.carregando{display:none;color:#aaa;font-size:12px;margin-top:16px}.saindo{animation:saindo .7s ease forwards}@keyframes aparecer{from{opacity:0;transform:scale(.7);filter:drop-shadow(0 0 0 rgba(0,0,0,0))}to{opacity:1;transform:scale(1);filter:drop-shadow(0 15px 30px rgba(0,0,0,.7))}}@keyframes subir{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@keyframes pulsar{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.1);opacity:.8}}@keyframes saindo{to{opacity:0;transform:scale(1.04)}}@media(max-width:600px){.escudo{width:115px;height:115px}.titulo{letter-spacing:-2px}.botoes{flex-direction:column}.btn{width:100%}.rodape{bottom:12px}}</style></head><body><main class="entrada" id="entrada"><div class="brilho"></div><div class="conteudo"><img class="escudo" src="1000001685.png" alt="Escudo da Seleção de Baixa Grande"><div class="linha"></div><div class="mini">Site oficial</div><h1 class="titulo">SELEÇÃO DE<br>BAIXA GRANDE</h1><h2 class="subtitulo">Bem-vindo ao site oficial</h2><p class="frase">Orgulho que vem de dentro de campo.</p><div class="botoes"><a class="btn principal" href="home.html" id="entrar">⚽ ENTRAR NO SITE</a></div><div class="carregando" id="carregando">Abrindo o site...</div></div><div class="rodape">BAIXA GRANDE • BAHIA</div></main><script>const entrada=document.getElementById('entrada');const entrar=document.getElementById('entrar');const carregando=document.getElementById('carregando');entrar.addEventListener('click',e=>{e.preventDefault();carregando.style.display='block';entrada.classList.add('saindo');setTimeout(()=>location.href='home.html',650)});</script></body></html>
