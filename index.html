<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Bem-vindo | Seleção de Baixa Grande</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff}body{overflow:hidden}.entrada{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:#050505}.foto-fundo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.42) saturate(.9);transform:scale(1.04);animation:fotoEntrada 2s ease both}.entrada:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.72)),linear-gradient(90deg,rgba(0,0,0,.38),rgba(181,18,27,.12),rgba(0,0,0,.38));z-index:1}.brilho{position:absolute;z-index:2;width:420px;height:420px;border-radius:50%;background:rgba(181,18,27,.18);filter:blur(85px);animation:pulsar 3s ease-in-out infinite}.conteudo{position:relative;z-index:3;width:min(900px,92%);animation:subir 1.2s ease both}.escudo{width:145px;height:145px;object-fit:contain;filter:drop-shadow(0 15px 30px rgba(0,0,0,.85));animation:aparecer 1.1s ease both}.linha{width:70px;height:3px;background:#b5121b;border-radius:5px;margin:22px auto;animation:expandir .8s .5s both}.mini{font-size:12px;font-weight:bold;letter-spacing:3px;color:#ff3440;text-transform:uppercase;animation:subir .7s .6s both}.titulo{font-size:clamp(38px,8vw,76px);line-height:.92;margin:12px 0;font-weight:900;letter-spacing:-3px;text-shadow:0 5px 25px #000;animation:subir .8s .7s both}.subtitulo{font-size:clamp(16px,3vw,22px);color:#fff;margin:18px 0 8px;text-shadow:0 3px 15px #000;animation:subir .8s .8s both}.frase{color:#ddd;font-size:14px;margin:0 auto;max-width:600px;line-height:1.6;text-shadow:0 2px 10px #000;animation:subir .8s .9s both}.botoes{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:32px;animation:subir .8s 1s both}.btn{border:0;cursor:pointer;text-decoration:none;padding:15px 24px;border-radius:10px;font-weight:bold;font-size:14px;min-width:190px;transition:.25s}.principal{background:#b5121b;color:#fff;box-shadow:0 10px 30px rgba(181,18,27,.4)}.btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(181,18,27,.5)}.rodape{position:absolute;bottom:20px;left:0;right:0;color:#ccc;font-size:11px;z-index:3;text-shadow:0 2px 8px #000;animation:subir .7s 1.1s both}.carregando{display:none;color:#fff;font-size:12px;margin-top:16px}.saindo{animation:saindo .7s ease forwards}@keyframes fotoEntrada{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:scale(1.04)}}@keyframes aparecer{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@keyframes subir{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@keyframes pulsar{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.1);opacity:.8}}@keyframes saindo{to{opacity:0;transform:scale(1.04)}}@keyframes expandir{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}@media(max-width:600px){.escudo{width:115px;height:115px}.titulo{letter-spacing:-2px}.botoes{flex-direction:column}.btn{width:100%}.rodape{bottom:12px}.foto-fundo{object-position:center center}}</style></head><body><main class="entrada" id="entrada"><img class="foto-fundo" src="baixagrande.jpg" alt="Seleção de Baixa Grande"><div class="brilho"></div><div class="conteudo"><img class="escudo" src="1000001685.png" alt="Escudo da Seleção de Baixa Grande"><div class="linha"></div><div class="mini">Site oficial</div><h1 class="titulo">SELEÇÃO DE<br>BAIXA GRANDE</h1><h2 class="subtitulo">Bem-vindo ao site oficial</h2><p class="frase">Orgulho que vem de dentro de campo.</p><div class="botoes"><a class="btn principal" href="home.html" id="entrar">⚽ ENTRAR NO SITE</a></div><div class="carregando" id="carregando">Abrindo o site...</div></div><div class="rodape">BAIXA GRANDE • BAHIA</div></main><script>const entrada=document.getElementById('entrada');const entrar=document.getElementById('entrar');const carregando=document.getElementById('carregando');entrar.addEventListener('click',e=>{e.preventDefault();carregando.style.display='block';entrada.classList.add('saindo');setTimeout(()=>location.href='home.html',650)});</script></body></html>
