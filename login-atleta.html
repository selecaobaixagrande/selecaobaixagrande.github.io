<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login do Atleta | Seleção de Baixa Grande</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#070707;color:#fff}.topo{padding:18px max(20px,calc((100% - 1180px)/2));background:#070707;border-bottom:1px solid #292b2f}.topo a{color:#aaa;text-decoration:none;font-size:13px;font-weight:800}.area{min-height:calc(100vh - 155px);display:flex;justify-content:center;align-items:center;padding:45px 18px;background:radial-gradient(circle at 50% 15%,rgba(181,18,27,.22),transparent 45%),#070707}.caixa{width:100%;max-width:450px;padding:38px;background:linear-gradient(145deg,#17181b,#0d0e10);border:1px solid #303238;border-radius:24px}.logo{width:92px;height:92px;object-fit:contain;display:block;margin:0 auto 22px}.eyebrow{text-align:center;color:#ff5660;font-size:10px;font-weight:900;letter-spacing:2.5px}h2{text-align:center;font-size:30px;margin:8px 0}.sub{text-align:center;color:#8f9298;font-size:13px;margin:0 0 28px}.campo{margin-bottom:17px}.campo label{display:block;font-size:12px;font-weight:850;margin-bottom:7px;color:#ddd}.campo input{width:100%;padding:14px 15px;border-radius:11px;border:1px solid #33363b;background:#08090a;color:#fff;outline:none;font-size:15px}.btn{width:100%;min-height:50px;border:1px solid #ed2733;border-radius:11px;background:#b5121b;color:#fff;font-weight:900;font-size:14px;cursor:pointer}.btn:disabled{opacity:.6}.mensagem{display:none;margin-top:15px;padding:12px;border-radius:10px;text-align:center;font-size:12px}.mensagem.erro{display:block;background:#2a0d0f;border:1px solid #7d1d25;color:#ff9da3}.mensagem.sucesso{display:block;background:#0d2415;border:1px solid #236b38;color:#8ee6a6}.link{display:block;text-align:center;margin-top:19px;color:#85888e;text-decoration:none;font-size:12px}footer{text-align:center;padding:25px 20px;background:#050505;border-top:1px solid #292b2f;color:#777;font-size:12px}@media(max-width:500px){.caixa{padding:30px 20px}h2{font-size:26px}}</style></head><body><div class="topo"><a href="atleta.html">← Voltar para área de acesso</a></div><main><section class="area"><div class="caixa"><img src="1000001685.png" alt="Escudo da Seleção de Baixa Grande" class="logo"><div class="eyebrow">ÁREA DO ATLETA</div><h2>Entrar no painel</h2><p class="sub">Acesse seu perfil, categoria e informações da Seleção.</p><form id="loginForm"><div class="campo"><label for="email">E-mail</label><input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="username" required></div><div class="campo"><label for="senha">Senha</label><input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required></div><button type="submit" class="btn" id="btnLogin">ENTRAR NO PAINEL</button></form><div id="mensagem" class="mensagem"></div><a href="atleta.html" class="link">← Voltar para escolha de acesso</a></div></section></main><footer><p><strong>⚽ SELEÇÃO DE BAIXA GRANDE</strong></p><p>Baixa Grande - Bahia • © 2026</p></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=window.supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),form=document.getElementById('loginForm'),mensagem=document.getElementById('mensagem'),botao=document.getElementById('btnLogin');function mostrar(t,tipo){mensagem.textContent=t;mensagem.className='mensagem '+tipo}form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),senha=document.getElementById('senha').value;if(!email||!senha)return mostrar('Digite seu e-mail e sua senha.','erro');botao.disabled=true;botao.textContent='ENTRANDO...';try{const r=await Promise.race([client.auth.signInWithPassword({email,password:senha}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('A conexão demorou demais. Tente novamente.')),10000))]);if(r.error)throw r.error;const user=r.data?.user;if(!user?.id)throw new Error('Não foi possível identificar sua conta.');const p=await Promise.race([client.from('atletas_publicos').select('id,nome,categoria,posicao').eq('id',user.id).maybeSingle(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Não foi possível verificar o perfil do atleta.')),8000))]);if(p.error)throw p.error;if(!p.data){await client.auth.signOut({scope:'local'});throw new Error('Sua conta está autenticada, mas não possui um perfil de atleta vinculado.');}localStorage.setItem('atleta_id',String(p.data.id));localStorage.setItem('atleta_nome',p.data.nome||'');localStorage.setItem('atleta_categoria',p.data.categoria||'');localStorage.setItem('atleta_posicao',p.data.posicao||'');mostrar('Login realizado! Abrindo seu perfil...','sucesso');location.href='painel-atleta.html'}catch(error){console.error('Login atleta:',error);mostrar(error.message||'Não foi possível entrar.','erro');botao.disabled=false;botao.textContent='ENTRAR NO PAINEL'}});</script></body></html>
