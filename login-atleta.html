<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login do Atleta | Seleção de Baixa Grande</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#070707;color:#fff}.topo{padding:18px max(20px,calc((100% - 1180px)/2));background:rgba(7,7,7,.9);border-bottom:1px solid #292b2f}.topo a{color:#aaa;text-decoration:none;font-size:13px;font-weight:800}.topo a:hover{color:#fff}.area{min-height:calc(100vh - 155px);display:flex;justify-content:center;align-items:center;padding:45px 18px;background:radial-gradient(circle at 50% 15%,rgba(181,18,27,.22),transparent 45%),#070707}.caixa{width:100%;max-width:450px;padding:38px;background:linear-gradient(145deg,#17181b,#0d0e10);border:1px solid #303238;border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.5)}.logo{width:92px;height:92px;object-fit:contain;display:block;margin:0 auto 22px;filter:drop-shadow(0 12px 25px rgba(0,0,0,.6))}.eyebrow{text-align:center;color:#ff5660;font-size:10px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase}h2{text-align:center;font-size:30px;letter-spacing:-1px;margin:8px 0}.sub{text-align:center;color:#8f9298;font-size:13px;margin:0 0 28px}.campo{margin-bottom:17px}.campo label{display:block;font-size:12px;font-weight:850;margin-bottom:7px;color:#ddd}.campo input{width:100%;padding:14px 15px;border-radius:11px;border:1px solid #33363b;background:#08090a;color:#fff;outline:none;font-size:15px}.campo input:focus{border-color:#b5121b;box-shadow:0 0 0 3px rgba(181,18,27,.14)}.btn{width:100%;min-height:50px;border:1px solid #ed2733;border-radius:11px;background:#b5121b;color:#fff;font-weight:900;font-size:14px;cursor:pointer;transition:.18s}.btn:hover{background:#ed2733;transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:not-allowed}.mensagem{display:none;margin-top:15px;padding:12px;border-radius:10px;text-align:center;font-size:12px}.mensagem.erro{display:block;background:#2a0d0f;border:1px solid #7d1d25;color:#ff9da3}.mensagem.sucesso{display:block;background:#0d2415;border:1px solid #236b38;color:#8ee6a6}.link{display:block;text-align:center;margin-top:19px;color:#85888e;text-decoration:none;font-size:12px}.link:hover{color:#fff}footer{text-align:center;padding:25px 20px;background:#050505;border-top:1px solid #292b2f;color:#777;font-size:12px}footer p{margin:5px}footer strong{color:#fff}@media(max-width:500px){.caixa{padding:30px 20px;border-radius:20px}h2{font-size:26px}}</style></head><body><div class="topo"><a href="atleta.html">← Voltar para área de acesso</a></div><main><section class="area"><div class="caixa"><img src="1000001685.png" alt="Escudo da Seleção de Baixa Grande" class="logo"><div class="eyebrow">ÁREA DO ATLETA</div><h2>Entrar no painel</h2><p class="sub">Acesse seu perfil, categoria e informações da Seleção.</p><form id="loginForm"><div class="campo"><label for="email">E-mail</label><input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="username" required></div><div class="campo"><label for="senha">Senha</label><input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required></div><button type="submit" class="btn" id="btnLogin">ENTRAR NO PAINEL</button></form><div id="mensagem" class="mensagem"></div><a href="atleta.html" class="link">← Voltar para escolha de acesso</a></div></section></main><footer><p><strong>⚽ SELEÇÃO DE BAIXA GRANDE</strong></p><p>Baixa Grande - Bahia • © 2026</p></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://lvxwziztdngntoqypzga.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvYz",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),form=document.getElementById("loginForm"),mensagem=document.getElementById("mensagem"),botao=document.getElementById("btnLogin");function mostrarMensagem(texto,tipo){mensagem.textContent=texto;mensagem.className="mensagem "+tipo}form.addEventListener("submit",async e=>{e.preventDefault();const email=document.getElementById("email").value.trim().toLowerCase(),senha=document.getElementById("senha").value;if(!email||!senha){mostrarMensagem("Digite seu e-mail e sua senha.","erro");return}botao.disabled=true;botao.textContent="ENTRANDO...";mostrarMensagem("Verificando seus dados...","sucesso");const{data,error}=await supabaseClient.auth.signInWithPassword({email,password:senha});if(error){console.error(error);mostrarMensagem("E-mail ou senha incorretos.","erro");botao.disabled=false;botao.textContent="ENTRAR NO PAINEL";return}const user=data.user;if(!user){mostrarMensagem("Não foi possível identificar sua conta.","erro");botao.disabled=false;botao.textContent="ENTRAR NO PAINEL";return}const{data:atleta,error:erroAtleta}=await supabaseClient.from("Atletas").select("*").eq("email",user.email).maybeSingle();if(erroAtleta){console.error(erroAtleta);mostrarMensagem("Não foi possível verificar o cadastro do atleta.","erro");await supabaseClient.auth.signOut();botao.disabled=false;botao.textContent="ENTRAR NO PAINEL";return}if(!atleta){mostrarMensagem("Esta conta não está cadastrada como atleta.","erro");await supabaseClient.auth.signOut();botao.disabled=false;botao.textContent="ENTRAR NO PAINEL";return}localStorage.setItem("atleta_id",String(atleta.id||""));localStorage.setItem("atleta_nome",atleta.nome||"");localStorage.setItem("atleta_email",atleta.email||"");localStorage.setItem("atleta_categoria",atleta.categoria||"");localStorage.setItem("atleta_posicao",atleta.posicao||"");mostrarMensagem("Login realizado! Abrindo seu painel...","sucesso");setTimeout(()=>location.href="painel-atleta.html",800)});</script></body></html>
