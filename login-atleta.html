<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login do Atleta | Seleção de Baixa Grande</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
}

header{
    background:#0d0d0d;
    border-bottom:1px solid #292929;
}

.header{
    max-width:1200px;
    margin:auto;
    padding:15px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.marca{
    display:flex;
    align-items:center;
    gap:12px;

    text-decoration:none;
    color:#fff;
}

.logo-header{
    width:55px;
    height:55px;
    object-fit:contain;
}

.marca h1{
    margin:0;
    font-size:18px;
}

.marca h1 span{
    color:#b5121b;
}

nav{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:13px;
}

nav a:hover{
    color:#fff;
}

.area-login{

    min-height:
    calc(100vh - 160px);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:50px 20px;

    background:
    radial-gradient(
        circle at center,
        rgba(181,18,27,.30),
        transparent 55%
    ),
    #080808;
}

.caixa-login{

    width:100%;

    max-width:430px;

    padding:35px;

    background:
    linear-gradient(
        145deg,
        #1c1c1c,
        #101010
    );

    border:1px solid #333;

    border-top:4px solid #b5121b;

    border-radius:20px;

    box-shadow:
    0 20px 50px
    rgba(0,0,0,.5);
}

.logo-login{

    width:100px;
    height:100px;

    object-fit:contain;

    display:block;

    margin:0 auto 20px;
}

h2{

    text-align:center;

    font-size:27px;

    margin:0 0 8px;
}

.subtitulo{

    text-align:center;

    color:#999;

    font-size:14px;

    margin:0 0 30px;
}

.campo{
    margin-bottom:18px;
}

.campo label{

    display:block;

    font-size:13px;

    font-weight:bold;

    margin-bottom:7px;
}

.campo input{

    width:100%;

    padding:14px;

    border-radius:9px;

    border:1px solid #333;

    background:#080808;

    color:#fff;

    outline:none;

    font-size:15px;
}

.campo input:focus{

    border-color:#b5121b;

    box-shadow:
    0 0 0 2px
    rgba(181,18,27,.15);
}

.btn{

    width:100%;

    min-height:50px;

    border:none;

    border-radius:9px;

    background:#b5121b;

    color:#fff;

    font-weight:bold;

    font-size:15px;

    cursor:pointer;

    transition:.2s;
}

.btn:hover{

    background:#e32632;

    transform:translateY(-2px);
}

.btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}

.mensagem{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:8px;

    text-align:center;

    font-size:13px;
}

.mensagem.erro{

    display:block;

    background:#2a0d0f;

    border:1px solid #7d1d25;

    color:#ff9da3;
}

.mensagem.sucesso{

    display:block;

    background:#0d2415;

    border:1px solid #236b38;

    color:#8ee6a6;
}

.link{

    display:block;

    text-align:center;

    margin-top:18px;

    color:#aaa;

    text-decoration:none;

    font-size:13px;
}

.link:hover{
    color:#fff;
}

footer{

    text-align:center;

    padding:25px 20px;

    background:#0d0d0d;

    border-top:1px solid #292929;

    color:#999;

    font-size:13px;
}

footer p{
    margin:5px;
}

footer strong{
    color:#fff;
}

@media(max-width:650px){

    .header{
        flex-direction:column;
    }

    nav{
        justify-content:center;
    }

    .caixa-login{
        padding:30px 20px;
    }

}

</style>

</head>

<body>

<header>

<div class="header">

<a href="index.html"
class="marca">

<img
src="1000001685.png"
alt="Escudo da Seleção de Baixa Grande"
class="logo-header">

<h1>

SELEÇÃO DE
<span>BAIXA GRANDE</span>

</h1>

</a>

<nav>

<a href="index.html">
Início
</a>

<a href="jogos.html">
Jogos
</a>

<a href="resultados.html">
Resultados
</a>

<a href="categorias.html">
Categorias
</a>

<a href="elenco.html">
Elenco
</a>

<a href="noticias.html">
Notícias
</a>

<a href="galeria.html">
Galeria
</a>

<a href="atleta.html">
👤 Acesso
</a>

</nav>

</div>

</header>

<main>

<section class="area-login">

<div class="caixa-login">

<img
src="1000001685.png"
alt="Escudo da Seleção de Baixa Grande"
class="logo-login">

<h2>
👤 Login do Atleta
</h2>

<p class="subtitulo">
Entre na sua área exclusiva.
</p>

<form id="loginForm">

<div class="campo">

<label for="email">
E-mail
</label>

<input
type="email"
id="email"
placeholder="Digite seu e-mail"
autocomplete="username"
required>

</div>

<div class="campo">

<label for="senha">
Senha
</label>

<input
type="password"
id="senha"
placeholder="Digite sua senha"
autocomplete="current-password"
required>

</div>

<button
type="submit"
class="btn"
id="btnLogin">

ENTRAR

</button>

</form>

<div
id="mensagem"
class="mensagem">
</div>

<a
href="atleta.html"
class="link">

← Voltar para escolha de acesso

</a>

</div>

<footer>

<p>

<strong>
⚽ SELEÇÃO DE BAIXA GRANDE
</strong>

</p>

<p>
Baixa Grande - Bahia
</p>

<p>
© 2026 Seleção de Baixa Grande
</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lvxwziztdngntoqypzga.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const form =
document.getElementById("loginForm");

const mensagem =
document.getElementById("mensagem");

const botao =
document.getElementById("btnLogin");


function mostrarMensagem(
    texto,
    tipo
){

    mensagem.textContent =
    texto;

    mensagem.className =
    "mensagem " + tipo;

}


form.addEventListener(
"submit",
async function(event){

    event.preventDefault();

    const email =
    document
    .getElementById("email")
    .value
    .trim();

    const senha =
    document
    .getElementById("senha")
    .value;


    if(!email || !senha){

        mostrarMensagem(
            "Digite seu e-mail e sua senha.",
            "erro"
        );

        return;

    }


    botao.disabled = true;

    botao.textContent =
    "ENTRANDO...";


    mostrarMensagem(
        "Verificando seus dados...",
        "sucesso"
    );


    /*
    LOGIN
    */

    const {
        data,
        error
    } =
    await supabaseClient
    .auth
    .signInWithPassword({

        email: email,

        password: senha

    });


    /*
    ERRO DE LOGIN
    */

    if(error){

        console.error(
            "Erro de login:",
            error
        );

        mostrarMensagem(
            "E-mail ou senha incorretos.",
            "erro"
        );

        botao.disabled = false;

        botao.textContent =
        "ENTRAR";

        return;

    }


    const user =
    data.user;


    if(!user){

        mostrarMensagem(
            "Não foi possível identificar sua conta.",
            "erro"
        );

        botao.disabled = false;

        botao.textContent =
        "ENTRAR";

        return;

    }


    /*
    BUSCAR PERFIL PELO E-MAIL
    */

    const {
        data: perfil,
        error: erroPerfil
    } =
    await supabaseClient
    .from("Perfis")
    .select("*")
    .eq("Email", user.email)
    .maybeSingle();


    /*
    ERRO AO BUSCAR PERFIL
    */

    if(erroPerfil){

        console.error(
            "Erro ao carregar perfil:",
            erroPerfil
        );

        mostrarMensagem(
            "Não foi possível carregar seu perfil.",
            "erro"
        );

        await supabaseClient
        .auth
        .signOut();

        botao.disabled = false;

        botao.textContent =
        "ENTRAR";

        return;

    }


    /*
    PERFIL NÃO ENCONTRADO
    */

    if(!perfil){

        mostrarMensagem(
            "Sua conta não possui um perfil de atleta cadastrado.",
            "erro"
        );

        await supabaseClient
        .auth
        .signOut();

        botao.disabled = false;

        botao.textContent =
        "ENTRAR";

        return;

    }


    /*
    VERIFICAR TIPO
    */

    const tipo =
    String(
        perfil.Tipo ||
        perfil.tipo ||
        ""
    )
    .trim()
    .toLowerCase();


    if(tipo !== "atleta"){

        mostrarMensagem(
            "Esta conta não está cadastrada como atleta.",
            "erro"
        );

        await supabaseClient
        .auth
        .signOut();

        botao.disabled = false;

        botao.textContent =
        "ENTRAR";

        return;

    }


    /*
    LOGIN APROVADO
    */

    mostrarMensagem(
        "Login realizado! Abrindo seu painel...",
        "sucesso"
    );


    setTimeout(
    function(){

        window.location.href =
        "painel-atleta.html";

    },
    800
    );

});

</script>

</body>

    </html>
