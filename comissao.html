  function abrirLogin(){
    var startup=document.getElementById('startup');
    var login=document.getElementById('login');
    if(startup) startup.classList.remove('active');
    if(login) login.classList.add('active');
  }
  window.__soitSelectProfile=function(i){
    var login=document.getElementById('login'), dashboard=document.getElementById('dashboard');
    if(login) login.classList.remove('active');
    if(dashboard) dashboard.classList.add('active');
    window.__soitPendingProfile=i;
    var pill=document.getElementById('perfilPill');
    if(pill) pill.textContent=['RAMON','RUBENS','ARLISON','GABRIEL'][i]||'SELEÇÃO';
  };
  document.addEventListener('click',function(ev){
    var b=ev.target.closest && ev.target.closest('.profile[data-i]');
    if(!b) return;
    ev.preventDefault();
    ev.stopPropagation();
    var i=Number(b.getAttribute('data-i'));
    if(Number.isFinite(i) && window.__soitSelectProfile) window.__soitSelectProfile(i);
  },true);
  window.setTimeout(abrirLogin,2300);
})();

const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
$('profiles').innerHTML=profiles.map((p,i)=>'<button type="button" class="profile" data-i="'+i+'"><span class="avatar">'+p[0][0]+'</span><span class="profileName">'+p[0]+'</span><span class="profileRole">'+p[1]+'</span></button>').join('');
function selectProfile(i){selected=i;$('login').classList.remove('active');$('dashboard').classList.add('active');$('perfilPill').textContent=profiles[i][0].toUpperCase();$('funcao').textContent=profiles[i][1];render()}
window.__soitSelectProfile=(i)=>selectProfile(i);document.querySelectorAll('.profile').forEach(b=>b.onclick=()=>selectProfile(+b.dataset.i));

function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
async function load(){const key=category+'|'+group;const names=OFFICIAL_ROSTER[key]||[];athletes=names.map((nome,i)=>({id:key+'|'+i,nome,categoria:category,posicao:'Atleta',foto:'1000001685.png'}));if(!athletes.length&&db){let r=await db.from('atletas_publicos').select('id,nome,categoria,posicao,numero_camisa,foto').eq('categoria',category).order('nome').limit(150);athletes=r.data||[]}renderTable()}
async function render(){if(tab==='chamada'){$('content').innerHTML='<div class="notice">Chamada profissional • '+category+' • '+group+' <span style="float:right;color:#6cff98">Presença</span></div><div class="controls"><select class="control" id="cat">'+Object.keys(groups).map(c=>'<option '+(c===category?'selected':'')+'>'+c+'</option>').join('')+'</select><select class="control" id="grp">'+groups[category].map(g=>'<option '+(g===group?'selected':'')+'>'+g+'</option>').join('')+'</select><input class="control" id="filtro" placeholder="Filtrar atleta..."></div><div class="stats"><div class="stat"><small>ATLETAS</small><b id="n">—</b></div><div class="stat"><small>PRESENTES</small><b id="p">0</b></div><div class="stat"><small>FALTAS</small><b id="f">0</b></div><div class="stat"><small>DM</small><b id="m">0</b></div></div><div class="table-wrap"><table class="table"><thead><tr><th>ATLETA</th><th>CATEGORIA</th><th>STATUS</th></tr></thead><tbody id="rows"></tbody></table></div>';$('cat').onchange=e=>{category=e.target.value;group=groups[category][0];render()};$('grp').onchange=e=>{group=e.target.value;render()};$('filtro').oninput=()=>renderTable();await load()}else if(tab==='rpe'){$('content').innerHTML='<div class="notice">Relatório de Rendimento Diário • intensidade geral do grupo selecionado.</div><div class="cards"><div class="tool-card"><h3>Intensidade geral</h3><p>Após finalizar o treino, registre a intensidade percebida do grupo em uma escala de 1 a 5.</p><div class="intensity" id="intensityButtons"><button onclick="setIntensity(1)">1</button><button onclick="setIntensity(2)">2</button><button onclick="setIntensity(3)">3</button><button onclick="setIntensity(4)">4</button><button onclick="setIntensity(5)">5</button></div><div class="big" id="intensityValue">—</div></div><div class="tool-card"><h3>RPE pós-treino</h3><p>Registre o nível de esforço percebido de cada atleta após a sessão.</p><div class="big">0–10</div><button class="btn primary" onclick="toast('Módulo RPE pronto para registro.')">Registrar RPE</button></div><div class="tool-card"><h3>Histórico</h3><p>Compare registros anteriores e acompanhe a evolução da carga.</p><div class="big">—</div></div><div class="tool-card"><h3>Objetivo</h3><p>Centralizar a informação de carga para apoiar o planejamento físico.</p><div class="big">RPE</div></div></div>'}else{$('content').innerHTML='<div class="notice">Relatório de olheiro (Scouting) • avaliação tática individual.</div><div class="cards"><div class="tool-card"><h3>Ficha individual</h3><p>Técnica, tática, tomada de decisão, posicionamento e intensidade.</p><div class="big">5 × 0–10</div><button class="btn primary" onclick="toast('Ficha de scouting pronta para registro.')">Abrir ficha</button></div><div class="tool-card"><h3>Observações</h3><p>Registre pontos fortes, aspectos a desenvolver e observações do jogo.</p></div><div class="tool-card"><h3>Histórico</h3><p>Consulte avaliações anteriores por atleta e competição.</p></div></div>'}}
function renderTable(){let q=($('filtro')?.value||'').toLowerCase();let arr=athletes.filter(a=>a.nome.toLowerCase().includes(q));$('n').textContent=arr.length;let counts={p:0,f:0,m:0};arr.forEach(a=>{let s=statuses[a.id]||'pendente';if(s==='presente')counts.p++;if(s==='medico')counts.m++;if(s==='falta')counts.f++});$('p').textContent=counts.p;$('f').textContent=counts.f;$('m').textContent=counts.m;$('rows').innerHTML=arr.map(a=>{let s=statuses[a.id]||'pendente';return '<tr><td><div class="ath"><div class="profile-photo"><img src="'+esc(a.foto||'1000001685.png')+'" alt="" onerror="this.src=\'1000001685.png\'"></div><span><b>'+esc(a.nome)+'</b><small style="display:block;color:#69736e">'+esc(a.posicao||'Posição não informada')+'</small></span></div></td><td>'+esc(a.categoria||category)+'</td><td><div class="status">'+['presente','falta','medico'].map(x=>'<button class="'+(s===x?'on':'')+'" onclick="setStatus(\''+a.id+'\',\''+x+'\')">'+({presente:'P',falta:'F',medico:'DM'}[x])+'</button>').join('')+'</div></td></tr>'}).join('')||'<tr><td colspan="3"><div class="empty">Nenhum atleta encontrado nesta categoria.</div></td></tr>'}
window.setStatus=(id,s)=>{statuses[id]=s;localStorage.setItem('soit_status',JSON.stringify(statuses));renderTable()};window.setIntensity=(n)=>{const key=category+'|'+group;intensities[key]=n;localStorage.setItem('soit_intensity',JSON.stringify(intensities));document.querySelectorAll('#intensityButtons button').forEach(b=>b.classList.toggle('on',+b.textContent===n));$('intensityValue').textContent=n+'/5';toast('Intensidade diária registrada.')};window.toast=toast;

})();
