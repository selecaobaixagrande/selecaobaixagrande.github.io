<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOIT | Comissão Técnica — Seleção de Baixa Grande</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0b;color:#f4f6f7;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,select,input{font:inherit}.app{min-height:100vh}.top{height:72px;border-bottom:1px solid #20262a;background:#0d1011;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;object-fit:contain}.brand b{font-size:13px;letter-spacing:.8px}.brand span{display:block;color:#7f8a8d;font-size:9px;letter-spacing:1.6px;margin-top:3px}.pill{border:1px solid #26302b;background:#111714;color:#8dffad;padding:8px 11px;border-radius:999px;font-size:9px;font-weight:900}
.wrap{max-width:1250px;margin:auto;padding:24px 18px 60px}.screen{display:none}.screen.active{display:block}.login{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:30px 15px;background:radial-gradient(circle at 50% 0,rgba(64,255,120,.08),transparent 35%)}.login-card{width:min(850px,100%);background:#0f1314;border:1px solid #28312d;border-radius:24px;padding:30px;box-shadow:0 25px 80px #0008}.eyebrow{color:#6cff98;font-size:9px;font-weight:900;letter-spacing:2.5px}.login h1{font-size:34px;margin:9px 0}.muted{color:#87918f;font-size:12px;line-height:1.6}.profiles{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:22px}.profile{border:1px solid #29312e;background:#121716;border-radius:16px;padding:18px;text-align:left;color:#fff;cursor:pointer;transition:.18s}.profile:hover,.profile.selected{border-color:#55ed83;background:#142019;transform:translateY(-2px)}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#17221c;color:#70ff9a;font-weight:900;margin-bottom:18px}.profile strong{display:block}.profile small{display:block;color:#84908b;font-size:10px;line-height:1.45;margin-top:5px}.btn{border:0;border-radius:10px;padding:12px 15px;font-size:10px;font-weight:900;cursor:pointer}.primary{background:#52e77e;color:#061008}.ghost{background:#141a18;color:#dfe7e3;border:1px solid #2a3530}.enter{margin-top:18px;width:100%}
.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.head h1{font-size:27px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:250px 1fr;gap:16px}.side,.panel{background:#0e1213;border:1px solid #242d29;border-radius:18px}.side{padding:14px;height:max-content;position:sticky;top:88px}.side button{width:100%;text-align:left;background:none;color:#a8b1ad;border:0;padding:12px;border-radius:10px;cursor:pointer;font-weight:800;font-size:11px}.side button.active,.side button:hover{background:#142019;color:#70ff9a}.side hr{border:0;border-top:1px solid #202925;margin:10px 0}.panel{padding:18px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:15px}.control{background:#121716;border:1px solid #27312c;color:#fff;border-radius:10px;padding:11px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:15px}.stat{background:#111615;border:1px solid #222b27;border-radius:13px;padding:13px}.stat small{color:#77827d;font-size:8px}.stat b{display:block;font-size:21px;margin-top:4px}.table-wrap{overflow:auto;border:1px solid #232c28;border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:11px;border-bottom:1px solid #202824;text-align:left;font-size:10px}.table th{color:#6cff98;background:#111615;font-size:8px;letter-spacing:1px}.ath{display:flex;align-items:center;gap:9px}.ath img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#202523}.status{display:flex;gap:5px}.status button{padding:7px 8px;border:1px solid #2a332f;background:#121716;color:#98a29d;border-radius:7px;font-size:8px;font-weight:900;cursor:pointer}.status button.on{border-color:#55ed83;background:#18301f;color:#8dffa9}.notice{padding:11px;border:1px solid #2a332f;background:#101514;border-radius:10px;color:#8d9893;font-size:10px;margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.tool-card{border:1px solid #26302b;background:#111615;border-radius:15px;padding:17px}.tool-card h3{margin:0 0 6px;font-size:16px}.tool-card p{margin:0;color:#808b86;font-size:10px;line-height:1.55}.tool-card .big{font-size:30px;font-weight:900;color:#72ff9b;margin:8px 0}.empty{padding:40px;text-align:center;color:#718079;border:1px dashed #2b3530;border-radius:14px}
.toast{position:fixed;right:16px;bottom:16px;background:#142019;border:1px solid #55ed83;color:#b7ffc9;padding:12px 14px;border-radius:10px;font-size:10px;display:none;z-index:50}
@media(max-width:800px){.profiles{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.side{position:static}.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.head{display:block}.actions{margin-top:10px}}
@media(max-width:480px){.profiles{grid-template-columns:1fr}.top{padding:0 13px}.brand b{font-size:11px}.wrap{padding:18px 12px 45px}.login-card{padding:21px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><img src="1000001685.png" alt=""><div><b>SOIT • SELEÇÃO DE BAIXA GRANDE</b><span>GESTÃO TÉCNICA • PAINEL INTERNO</span></div></div><div class="pill" id="perfilPill">SESSÃO NÃO INICIADA</div></header>

<section id="login" class="screen active">
<div class="login"><div class="login-card">
<div class="eyebrow">SISTEMA OPERACIONAL DE INTELIGÊNCIA TÉCNICA</div><h1>Selecione seu perfil</h1><p class="muted">Painel de gestão para comissão técnica, categorias, grupos, presença, carga física e scouting.</p>
<div class="profiles" id="profiles"></div><button class="btn primary enter" id="entrar" disabled>ENTRAR NO PAINEL</button>
</div></div>
</section>

<section id="dashboard" class="screen">
<div class="wrap">
<div class="head"><div><div class="eyebrow" id="funcao"></div><h1 id="titulo">Painel profissional</h1></div><div class="actions"><button class="btn ghost" id="trocar">Trocar perfil</button><button class="btn primary" id="salvar">Salvar alterações</button></div></div>
<div class="layout"><aside class="side">
<button class="active" data-tab="chamada">📋 Chamada</button><button data-tab="rpe">⚡ Carga física • RPE</button><button data-tab="scouting">◈ Scouting</button><hr>
<div class="muted" style="padding:8px 10px">Categorias</div>
<button data-cat="Sub-13">Sub-13</button><button data-cat="Sub-15">Sub-15</button><button data-cat="Sub-17">Sub-17</button><button data-cat="Sub-20">Sub-20</button>
</aside><main class="panel" id="content"></main></div>
</div>
</section>
</div><div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const db=window.supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY');
const profiles=[
['Ramon','Treinador Principal / Coordenador Técnico'],['Rubens','Auxiliar Técnico / Analista de Desempenho'],
['Arlison','Preparador Físico / Fisiologista'],['Gabriel','Diretor de Futebol / Gestor de Elenco']];
let selected=null, category='Sub-13', group='Grupo A', tab='chamada', athletes=[], statuses=JSON.parse(localStorage.getItem('soit_status')||'{}');
const groups={'Sub-13':['Grupo A','Grupo B'],'Sub-15':['Grupo A'],'Sub-17':['Grupo A'],'Sub-20':['Sem grupo definido']};
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
$('profiles').innerHTML=profiles.map((p,i)=>'<button class="profile" data-i="'+i+'"><span class="avatar">'+p[0][0]+'</span><strong>'+p[0]+'</strong><small>'+p[1]+'</small></button>').join('');
document.querySelectorAll('.profile').forEach(b=>b.onclick=()=>{document.querySelectorAll('.profile').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=+b.dataset.i;$('entrar').disabled=false});
$('entrar').onclick=()=>{if(selected===null)return;$('login').classList.remove('active');$('dashboard').classList.add('active');$('perfilPill').textContent=profiles[selected][0].toUpperCase();$('funcao').textContent=profiles[selected][1];render()};
$('trocar').onclick=()=>{$('dashboard').classList.remove('active');$('login').classList.add('active');$('perfilPill').textContent='SESSÃO NÃO INICIADA'};
document.querySelectorAll('.side button[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.side button[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
document.querySelectorAll('.side button[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;group=groups[category][0];render()});
$('salvar').onclick=()=>{localStorage.setItem('soit_status',JSON.stringify(statuses));toast('Alterações salvas neste dispositivo.')};
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
async function load(){let r=await db.from('atletas_publicos').select('id,nome,categoria,posicao,numero_camisa,foto').eq('categoria',category).order('nome').limit(150);athletes=r.data||[];renderTable()}
async function render(){if(tab==='chamada'){$('content').innerHTML='<div class="notice">Chamada profissional • '+category+' • '+group+' <span style="float:right;color:#6cff98">Presença</span></div><div class="controls"><select class="control" id="cat">'+Object.keys(groups).map(c=>'<option '+(c===category?'selected':'')+'>'+c+'</option>').join('')+'</select><select class="control" id="grp">'+groups[category].map(g=>'<option '+(g===group?'selected':'')+'>'+g+'</option>').join('')+'</select><input class="control" id="filtro" placeholder="Filtrar atleta..."></div><div class="stats"><div class="stat"><small>ATLETAS</small><b id="n">—</b></div><div class="stat"><small>PRESENTES</small><b id="p">0</b></div><div class="stat"><small>JUSTIFICADAS</small><b id="j">0</b></div><div class="stat"><small>MÉDICO</small><b id="m">0</b></div></div><div class="table-wrap"><table class="table"><thead><tr><th>ATLETA</th><th>CATEGORIA</th><th>STATUS</th></tr></thead><tbody id="rows"></tbody></table></div>';$('cat').onchange=e=>{category=e.target.value;group=groups[category][0];render()};$('grp').onchange=e=>{group=e.target.value;render()};$('filtro').oninput=()=>renderTable();await load()}else if(tab==='rpe'){$('content').innerHTML='<div class="notice">Histórico de carga física (RPE) • escala de 0 a 10.</div><div class="cards"><div class="tool-card"><h3>RPE pós-treino</h3><p>Registre o nível de esforço percebido de cada atleta após a sessão.</p><div class="big">0–10</div><button class="btn primary" onclick="toast(\'Módulo RPE pronto para registro.\')">Registrar RPE</button></div><div class="tool-card"><h3>Histórico</h3><p>Compare registros anteriores e acompanhe a evolução da carga.</p><div class="big">—</div></div><div class="tool-card"><h3>Objetivo</h3><p>Centralizar a informação de carga para apoiar o planejamento físico.</p><div class="big">RPE</div></div></div>'}else{$('content').innerHTML='<div class="notice">Relatório de olheiro (Scouting) • avaliação tática individual.</div><div class="cards"><div class="tool-card"><h3>Ficha individual</h3><p>Técnica, tática, tomada de decisão, posicionamento e intensidade.</p><div class="big">5 × 0–10</div><button class="btn primary" onclick="toast(\'Ficha de scouting pronta para registro.\')">Abrir ficha</button></div><div class="tool-card"><h3>Observações</h3><p>Registre pontos fortes, aspectos a desenvolver e observações do jogo.</p></div><div class="tool-card"><h3>Histórico</h3><p>Consulte avaliações anteriores por atleta e competição.</p></div></div>'}}
function renderTable(){let q=($('filtro')?.value||'').toLowerCase();let arr=athletes.filter(a=>a.nome.toLowerCase().includes(q));$('n').textContent=arr.length;let counts={p:0,j:0,m:0};arr.forEach(a=>{let s=statuses[a.id]||'pendente';if(s==='presente')counts.p++;if(s==='justificada')counts.j++;if(s==='medico')counts.m++});$('p').textContent=counts.p;$('j').textContent=counts.j;$('m').textContent=counts.m;$('rows').innerHTML=arr.map(a=>{let s=statuses[a.id]||'pendente';return '<tr><td><div class="ath"><img src="'+esc(a.foto||'1000001685.png')+'" onerror="this.src=\'1000001685.png\'"><span><b>'+esc(a.nome)+'</b><small style="display:block;color:#69736e">'+esc(a.posicao||'Posição não informada')+'</small></span></div></td><td>'+esc(a.categoria||category)+'</td><td><div class="status">'+['presente','justificada','medico'].map(x=>'<button class="'+(s===x?'on':'')+'" onclick="setStatus(\''+a.id+'\',\''+x+'\')">'+({presente:'PRESENTE',justificada:'JUSTIFICADA',medico:'MÉDICO'}[x])+'</button>').join('')+'</div></td></tr>'}).join('')||'<tr><td colspan="3"><div class="empty">Nenhum atleta encontrado nesta categoria.</div></td></tr>'}
window.setStatus=(id,s)=>{statuses[id]=s;localStorage.setItem('soit_status',JSON.stringify(statuses));renderTable()};
window.toast=toast;
})();
</script>
</body></html>
