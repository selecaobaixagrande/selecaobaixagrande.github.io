<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Seleção de Baixa Grande | Site Oficial</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

a{
    text-decoration:none;
    color:inherit;
}

.wrap{
    max-width:1120px;
    margin:auto;
    padding:0 18px;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(8,8,8,.94);
    border-bottom:1px solid #292929;
    backdrop-filter:blur(10px);
}

.head{
    height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:900;
}

.brand img{
    width:39px;
    height:39px;
    object-fit:contain;
}

.brand span{
    display:block;
    color:#b5121b;
}

.nav{
    display:flex;
    gap:4px;
}

.nav a{
    padding:8px 9px;
    border-radius:7px;
    color:#aaa;
    font-size:12px;
    font-weight:bold;
}

.nav a:hover,
.nav a.active{
    background:#b5121b;
    color:#fff;
}

.menu{
    display:none;
    background:#151515;
    border:1px solid #333;
    color:#fff;
    border-radius:8px;
    padding:9px 12px;
    font-weight:bold;
}

/* HERO */

.hero{
    min-height:calc(100vh - 62px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:70px 18px;
    background:
        radial-gradient(
            circle at center,
            rgba(181,18,27,.28),
            transparent 52%
        ),
        linear-gradient(#0d0d0d,#080808);
}

.hero-inner{
    max-width:780px;
    margin:auto;
}

.shield{
    width:140px;
    height:140px;
    object-fit:contain;
    filter:drop-shadow(0 15px 28px #000);
    animation:pop 1s both;
}

.hero h1{
    font-size:clamp(40px,8vw,64px);
    line-height:.92;
    margin:18px 0 10px;
    letter-spacing:-3px;
    animation:up .8s .2s both;
}

.hero h2{
    font-size:19px;
    color:#ddd;
    margin-bottom:8px;
    animation:up .8s .35s both;
}

.hero p{
    color:#999;
    animation:up .8s .45s both;
}

.actions{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:26px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#b5121b;
    color:#fff;
    padding:12px 17px;
    border-radius:9px;
    font-weight:bold;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-3px);
    background:#e32632;
}

.btn.light{
    background:#fff;
    color:#111;
}

/* SEÇÕES */

.section{
    padding:58px 0;
}

.reveal{
    opacity:0;
    transform:translateY(24px);
    transition:
        opacity .7s ease,
        transform .7s ease;
}

.reveal.show{
    opacity:1;
    transform:none;
}

.title{
    text-align:center;
    margin-bottom:28px;
}

.title small{
    color:#b5121b;
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
}

.title h2{
    font-size:30px;
    margin:7px 0;
}

.title p{
    color:#999;
    max-width:650px;
    margin:8px auto;
    line-height:1.5;
}

/* NOTÍCIA */

.news{
    max-width:900px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#121212;
    border:1px solid #303030;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 18px 50px #0005;
}

.news img{
    width:100%;
    height:100%;
    min-height:310px;
    object-fit:contain;
    background:#050505;
}

.news-info{
    padding:26px;
}

.tag{
    display:inline-block;
    background:#b5121b;
    color:#fff;
    padding:7px 10px;
    border-radius:7px;
    font-size:10px;
    font-weight:900;
}

.news h3{
    font-size:clamp(25px,4vw,36px);
    line-height:1.05;
    margin:12px 0;
}

.muted{
    color:#999;
    line-height:1.6;
}

/* JOGO */

.game{
    max-width:820px;
    margin:auto;
    padding:28px;
    text-align:center;
    background:linear-gradient(145deg,#191919,#0e0e0e);
    border:1px solid #292929;
    border-radius:16px;
}

.teams{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:30px;
}

.team{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    font-weight:900;
}

.team img{
    width:70px;
    height:70px;
    object-fit:contain;
}

.vs{
    font-size:20px;
    color:#b5121b;
    font-weight:900;
}

.info{
    color:#999;
    line-height:1.8;
    margin:20px 0;
    border-top:1px solid #292929;
    padding-top:16px;
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card{
    background:linear-gradient(145deg,#191919,#0e0e0e);
    border:1px solid #292929;
    border-radius:15px;
    padding:22px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#b5121b;
}

.icon{
    font-size:30px;
}

.card h3{
    margin:9px 0;
}

.card p{
    color:#999;
    line-height:1.5;
    font-size:14px;
}

/* ESTATÍSTICAS */

.stats .card{
    text-align:center;
}

.number{
    font-size:34px;
    font-weight:900;
    display:block;
    margin:8px 0;
}

/* ATLETAS */

.highlight{
    max-width:900px;
    margin:auto;
    display:grid;
    grid-template-columns:180px 1fr;
    background:linear-gradient(145deg,#191919,#0e0e0e);
    border:1px solid #292929;
    border-radius:16px;
    overflow:hidden;
}

.highlight img{
    width:100%;
    height:100%;
    min-height:210px;
    object-fit:contain;
    background:#050505;
}

.highlight-info{
    padding:24px;
}

.highlight-info h3{
    font-size:27px;
    margin:8px 0;
}

/* COMISSÃO */

.staff-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.staff{
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
    padding:18px;
    text-align:center;
}

.staff .photo{
    width:82px;
    height:82px;
    border-radius:50%;
    margin:0 auto 10px;
    background:#181818;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.staff h3{
    font-size:15px;
    margin:7px 0;
}

.staff p{
    font-size:12px;
    color:#999;
    line-height:1.4;
}

/* MINI */

.mini-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.mini{
    padding:22px;
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
}

.mini h3{
    margin:7px 0;
}

.mini p{
    color:#999;
    line-height:1.5;
}

/* SOCIAL */

.social{
    text-align:center;
    padding:30px;
    background:linear-gradient(145deg,#191919,#0e0e0e);
    border:1px solid #292929;
    border-radius:16px;
}

/* FOOTER */

footer{
    text-align:center;
    padding:30px 18px;
    border-top:1px solid #292929;
    color:#777;
    font-size:12px;
}

footer strong{
    color:#fff;
}

/* ANIMAÇÕES */

@keyframes up{
    from{
        opacity:0;
        transform:translateY(22px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

@keyframes pop{
    from{
        opacity:0;
        transform:scale(.65);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* MOBILE */

@media(max-width:760px){

    .menu{
        display:block;
    }

    .nav{
        display:none;
        position:absolute;
        right:12px;
        top:60px;
        width:180px;
        padding:5px;
        flex-direction:column;
        background:#0d0d0d;
        border:1px solid #333;
        border-radius:10px;
        box-shadow:0 15px 35px #000;
    }

    .nav.open{
        display:flex;
    }

    .nav a{
        padding:11px;
    }

    .news,
    .highlight{
        grid-template-columns:1fr;
    }

    .news img{
        min-height:0;
        max-height:420px;
    }

    .highlight img{
        min-height:0;
        max-height:420px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .mini-grid{
        grid-template-columns:1fr;
    }

    .staff-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .hero{
        padding:55px 18px;
    }

    .shield{
        width:110px;
        height:110px;
    }

    .teams{
        gap:14px;
    }

    .team img{
        width:60px;
        height:60px;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none!important;
        transition:none!important;
    }
}
</style>
</head>
