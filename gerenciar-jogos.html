<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar Jogos | Seleção de Baixa Grande</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:30px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#111;border:1px solid #292929;border-radius:14px;padding:18px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select,textarea{width:100%;padding:12px;background:#080808;color:#fff;border:1px solid #333;border-radius:8px;box-sizing:border-box}label{font-size:12px;color:#aaa}button,a{padding:11px 15px;border:0;border-radius:8px;background:#b5121b;color:#fff;font-weight:bold;text-decoration:none;cursor:pointer}.sec{background:#292929}.acoes{display:flex;gap:8px;flex-wrap:wrap}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #292929;padding:15px 0}.muted{color:#999}.erro{display:none;background:#2a0d0f;color:#ff9da3;padding:12px;border-radius:8px}.full{grid-column:1/-1}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{flex-direction:column;align-items:flex-start}}</style></head><body><main><div class="top"><div><div class="muted">COMISSÃO TÉCNICA</div><h1>⚽ Gerenciar jogos</h1><p class="muted">Cadastre e atualize as partidas da Seleção.</p></div><a class="sec" href="painel-treinador.html">← Painel</a></div><div id="erro" class="erro"></div><section class="card"><h2 id="titulo">Cadastrar jogo</h2><div class="grid"><div><label>Adversário *</label><input id="adversario"></div><div><label>Competição</label><input id="competicao"></div><div><label>Data *</label><input id="data" type="date"></div><div><label>Horário</label><input id="horario" type="time"></div><div><label>Local</label><input id="local"></div><div><label>Status</label><select id="status"><option value="agendado">Agendado</option><option value="finalizado">Finalizado</option><option value="cancelado">Cancelado</option></select></div><div><label>Gols Baixa Grande</label><input id="gb" type="number" min="0" value="0"></div><div><label>Gols adversário</label><input id="ga" type="number" min="0" value="0"></div><div><label>Destaque</label><input id="destaque"></div><div><label>Escudo do adversário (URL, opcional)</label><input id="escudo"></div><div class="full"><label>Observações</label><textarea id="obs" rows="3"></textarea></div></div><br><div class="acoes"><button id="salvar">💾 Salvar jogo</button><button id="cancelar" class="sec">Cancelar edição</button></div></section><section class="card"><h2>Partidas cadastradas</h2><div id="lista">Carregando...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY');let edit=null;const $=x=>document.getElementById(x);const err=x=>{$('erro').textContent=x;$('erro').style.display='block'};function clear(){ $('erro').style.display='none'}function reset(){edit=null;$('titulo').textContent='Cadastrar jogo';['adversario','competicao','data','horario','local','destaque','escudo','obs'].forEach(x=>$(x).value='');$('status').value='agendado';$('gb').value=0;$('ga').value=0}async function carregar(){clear();const r=await sb.from('jogos').select('*').order('data_jogo',{ascending:false});if(r.error)return err(r.error.message);$('lista').innerHTML=r.data?.length?r.data.map(j=>`<div class="item"><div><b>${j.adversario||'Adversário'}</b><div class="muted">${j.data_jogo||''} • ${j.horario||''} • ${j.local||''}</div><div>${j.status||''} ${j.status==='finalizado'?`• ${j.gols_baixa_grande??0} x ${j.gols_adversario??0}`:''}</div></div><div class="acoes"><button onclick="editar('${j.id}')">✏️ Editar</button><button class="sec" onclick="excluir('${j.id}')">🗑️ Excluir</button></div></div>`).join(''):'<p class="muted">Nenhum jogo cadastrado.</p>'}window.editar=async id=>{const r=await sb.from('jogos').select('*').eq('id',id).single();if(r.error)return err(r.error.message);const j=r.data;edit=id;$('titulo').textContent='Editar jogo';$('adversario').value=j.adversario||'';$('competicao').value=j.competicao||'';$('data').value=j.data_jogo||'';$('horario').value=(j.horario||'').slice(0,5);$('local').value=j.local||'';$('status').value=j.status||'agendado';$('gb').value=j.gols_baixa_grande??0;$('ga').value=j.gols_adversario??0;$('destaque').value=j.destaque||'';$('escudo').value=j.escudo_adversario||'';$('obs').value=j.observacoes||'';scrollTo(0,0)};window.excluir=async id=>{if(!confirm('Excluir este jogo?'))return;const r=await sb.from('jogos').delete().eq('id',id);if(r.error)return err(r.error.message);carregar()};$('salvar').onclick=async()=>{clear();if(!$('adversario').value.trim()||!$('data').value)return err('Informe adversário e data.');const d={adversario:$('adversario').value.trim(),competicao:$('competicao').value.trim()||null,data_jogo:$('data').value,horario:$('horario').value||null,local:$('local').value.trim()||null,status:$('status').value,gols_baixa_grande:+$('gb').value||0,gols_adversario:+$('ga').value||0,destaque:$('destaque').value.trim()||null,escudo_adversario:$('escudo').value.trim()||null,observacoes:$('obs').value.trim()||null};const r=edit?await sb.from('jogos').update(d).eq('id',edit):await sb.from('jogos').insert(d);if(r.error)return err(r.error.message);reset();carregar()};$('cancelar').onclick=reset;carregar()</script></body></html>
