plugins { id 'com.android.application' }

android {
    namespace 'br.com.selecaobaixagrande.app'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.selecaobaixagrande.app'
        minSdk 23
        targetSdk 36
        versionCode 13
        versionName '2.0.0'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Seleção De Baixa Grande.apk"
        }
    }
}
