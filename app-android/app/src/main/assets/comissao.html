<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070809"><title>SOIT · Comissão Técnica</title><style>
*{box-sizing:border-box}body{margin:0;background:#070809;color:#fff;font-family:Arial,system-ui,sans-serif}.top{height:72px;padding:10px 14px;border-bottom:1px solid #292d31;background:#090a0b;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:45px;height:45px;object-fit:contain}.brand b{display:block;font-size:11px}.brand small{color:#8c9499;font-size:7px;letter-spacing:1.5px}.pill{font-size:8px;color:#ffb1b5;border:1px solid #542127;background:#190d0f;padding:8px 10px;border-radius:20px}.screen{display:none}.screen.active{display:block}.login{min-height:calc(100vh - 72px);padding:25px 14px;display:none;align-items:center;justify-content:center}.login.active{display:flex}.card{width:min(900px,100%);padding:25px;border:1px solid #30363a;border-radius:22px;background:#101315}.k{color:#ed2733;font-size:8px;font-weight:900;letter-spacing:2px}.card h1{font-size:30px;margin:8px 0}.muted{color:#8d979b;font-size:11px}.profiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.profile,.module{border:1px solid #30363a;border-radius:16px;background:#15191b;color:#fff;padding:18px 10px;cursor:pointer}.profile:hover,.module:hover{border-color:#b5121b}.avatar{width:65px;height:65px;border-radius:50%;overflow:hidden;margin:auto auto 10px;background:#260f12}.avatar img{width:100%;height:100%;object-fit:cover}.profile strong{display:block;font-size:13px}.profile small{display:block;color:#858e93;font-size:8px;margin-top:4px}.dash{padding:20px 14px}.wrap{max-width:1000px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.head h1{font-size:28px;margin:0}.head p{color:#858e93;font-size:10px;margin:5px 0}.btn{border:1px solid #363d40;background:#15191b;color:#fff;border-radius:10px;padding:10px 12px;font-size:9px;font-weight:900}.btn.red{background:#b5121b;border-color:#ed2733}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.toolbar button{border:1px solid #30363a;background:#121617;color:#aab0b4;border-radius:9px;padding:9px 11px;font-size:8px;font-weight:900}.toolbar button.on{background:#2a1013;color:#fff;border-color:#b5121b}.panel{border:1px solid #292f33;border-radius:18px;background:#101315;padding:17px}.panel h2{font-size:13px;margin:0 0 5px}.panel p{color:#858e93;font-size:9px;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.ath{display:flex;align-items:center;justify-content:space-between;border:1px solid #292f33;border-radius:12px;padding:11px;background:#141819}.ath b{font-size:10px}.ath small{display:block;color:#737d82;font-size:7px;margin-top:3px}.status{display:flex;gap:4px}.status button{border:1px solid #30363a;background:#121617;color:#9ba3a7;border-radius:7px;padding:7px;font-size:8px;font-weight:900}.status button.on{background:#2a1013;color:#ffb1b5;border-color:#b5121b}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.module{text-align:left}.module b{display:block;font-size:12px}.module small{display:block;color:#7e888c;font-size:8px;margin-top:6px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#181c1e;border:1px solid #542127;padding:10px 14px;border-radius:10px;font-size:9px;display:none}.toast.show{display:block}@media(max-width:700px){.profiles{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:480px){.profiles{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header class="top"><div class="brand"><img src="https://selecaobaixagrande.github.io/1000001685.png"><div><b>SOIT · SELEÇÃO DE BAIXA GRANDE</b><small>GESTÃO TÉCNICA · PAINEL INTERNO</small></div></div><div class="pill" id="pill">SESSÃO NÃO INICIADA</div></header>
<section id="login" class="screen login active"><div class="card"><div class="k">ACESSO INTERNO</div><h1>Quem está acessando?</h1><div class="muted">Selecione o perfil da comissão técnica.</div><div class="profiles">
<button class="profile" data-name="Ramon"><div class="avatar"><img src="https://selecaobaixagrande.github.io/file_00000000be04820ea1ba9add36276082~4.jpg"></div><strong>Ramon</strong><small>Treinador Principal · Coordenador Técnico</small></button>
<button class="profile" data-name="Rubens"><div class="avatar"><img src="https://selecaobaixagrande.github.io/file_00000000be04820ea1ba9add36276082~5.jpg"></div><strong>Rubens</strong><small>Auxiliar Técnico · Analista de Desempenho</small></button>
<button class="profile" data-name="Arlison"><div class="avatar"><img src="https://selecaobaixagrande.github.io/file_00000000be04820ea1ba9add36276082~6.jpg"></div><strong>Arlison</strong><small>Preparador Físico · Fisiologista</small></button>
<button class="profile" data-name="Gabriel"><div class="avatar"><img src="https://selecaobaixagrande.github.io/2026_08_17_13.56.20~2.jpg"></div><strong>Gabriel</strong><small>Diretor de Futebol · Gestor de Elenco</small></button>
</div></div></section>
<section id="dash" class="screen dash"><div class="wrap"><div class="head"><div><h1>Painel profissional</h1><p id="welcome"></p></div><div><button class="btn" id="logout">Trocar perfil</button></div></div>
<div class="toolbar"><button class="on" data-cat="Sub-13">Sub-13</button><button data-cat="Sub-15">Sub-15</button><button data-cat="Sub-17">Sub-17</button><button data-cat="Sub-20">Sub-20</button><button id="group">Grupo A</button></div>
<div id="content" class="panel"></div></div></section><div id="toast" class="toast"></div>
<script>
(function(){var profile='',cat='Sub-13',group='Grupo A',module='presenca',status={};var names=['Gabriel','Vinícius','Rian','Nycolas','Miguel','Willyam','Henrique','Davi'];var $=function(x){return document.getElementById(x)};function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show')},1500)}function render(){if(module==='presenca'){var h='<h2>Presença no treino</h2><p>'+cat+' · '+group+' — marque a situação de cada atleta.</p><div class="grid">';names.forEach(function(n,i){var k=cat+'-'+group+'-'+i,s=status[k]||'';h+='<div class="ath"><div><b>'+n+'</b><small>'+cat+'</small></div><div class="status"><button data-s="'+k+'" data-v="P" class="'+(s==='P'?'on':'')+'">P</button><button data-s="'+k+'" data-v="F" class="'+(s==='F'?'on':'')+'">F</button><button data-s="'+k+'" data-v="J" class="'+(s==='J'?'on':'')+'">J</button></div></div>'});h+='</div>';$('content').innerHTML=h}else{$('content').innerHTML='<h2>'+moduleTitle(module)+'</h2><p>Módulo interno da comissão técnica.</p><div class="cards"><button class="module" data-m="presenca"><b>Presença</b><small>Controle diário</small></button><button class="module" data-m="treinos"><b>Treinos</b><small>Organização dos trabalhos</small></button><button class="module" data-m="jogos"><b>Jogos</b><small>Partidas e informações</small></button><button class="module" data-m="atletas"><b>Atletas</b><small>Elenco interno</small></button><button class="module" data-m="desempenho"><b>Desempenho</b><small>Avaliações e evolução</small></button><button class="module" data-m="rpe"><b>Carga RPE</b><small>Intensidade percebida</small></button></div>'}}function moduleTitle(x){return ({presenca:'Presença',treinos:'Treinos',jogos:'Jogos',atletas:'Atletas',desempenho:'Desempenho',rpe:'Carga RPE'})[x]||'Módulo'}document.addEventListener('click',function(e){var p=e.target.closest('.profile');if(p){profile=p.dataset.name;$('pill').textContent=profile.toUpperCase();$('welcome').textContent='Sessão de '+profile+' · gestão diária da comissão';$('login').classList.remove('active');$('dash').classList.add('active');module='presenca';render();return}var c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;document.querySelectorAll('[data-cat]').forEach(function(x){x.classList.toggle('on',x===c)});render();return}if(e.target.id==='group'){group=group==='Grupo A'?'Grupo B':'Grupo A';e.target.textContent=group;render();return}var s=e.target.closest('[data-s]');if(s){status[s.dataset.s]=s.dataset.v;s.classList.add('on');render();toast('Situação registrada');return}var m=e.target.closest('[data-m]');if(m){module=m.dataset.m;render();return}if(e.target.id==='logout'){profile='';$('pill').textContent='SESSÃO NÃO INICIADA';$('dash').classList.remove('active');$('login').classList.add('active')}});render()})();
</script></body></html>
