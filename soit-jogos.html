<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070809"><title>Jogos | SOIT</title><link rel="stylesheet" href="soit-modulo.css"></head><body><div class="app"><header class="top"><div class="brand"><img src="1000001685.png"><div><b>SOIT · SELEÇÃO DE BAIXA GRANDE</b><span>GESTÃO DE JOGOS</span></div></div><div class="pill" id="profilePill">RAMON</div></header><main class="wrap"><button class="back" data-back>← Voltar ao painel</button><section class="hero"><div><div class="kicker">COMPETIÇÕES</div><h1>Jogos</h1><p>Controle de partidas, adversários, locais e resultados.</p></div></section><section class="panel"><div class="filters"><label class="field"><small>ADVERSÁRIO</small><input id="opp" placeholder="Nome do adversário"></label><label class="field"><small>COMPETIÇÃO</small><input id="comp" placeholder="Competição"></label><label class="field"><small>DATA</small><input id="date" type="date"></label><label class="field"><small>LOCAL</small><input id="place" placeholder="Local"></label></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="saveGame">Cadastrar jogo</button></div></section><section class="panel"><div class="panelTitle">Jogos cadastrados</div><div class="list" id="list"></div></section><div id="toast" class="toast"></div></main></div><script src="soit-modulo.js"></script><script>(function(){const K='soit_jogos';let a=JSON.parse(localStorage.getItem(K)||'[]');function render(){list.innerHTML=a.map((x,i)=>'<div class="row"><div><strong>Baixa Grande × '+x.opp+'</strong><small>'+x.date+' · '+x.comp+' · '+x.place+'</small></div><button class="btn" onclick="removeGame('+i+')">Excluir</button></div>').join('')||'<div class="note">Nenhum jogo cadastrado.</div>'}window.removeGame=i=>{a.splice(i,1);localStorage.setItem(K,JSON.stringify(a));render()};saveGame.onclick=()=>{a.unshift({opp:opp.value,comp:comp.value,date:date.value,place:place.value});localStorage.setItem(K,JSON.stringify(a));render();soitToast('Jogo cadastrado')};render()})();</script></body></html>
