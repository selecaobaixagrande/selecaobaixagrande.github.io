<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070809"><title>Scouting | SOIT</title><link rel="stylesheet" href="soit-modulo.css"></head><body><div class="app"><header class="top"><div class="brand"><img src="1000001685.png"><div><b>SOIT · SELEÇÃO DE BAIXA GRANDE</b><span>SCOUTING INTERNO</span></div></div><div class="pill" id="profilePill">RAMON</div></header><main class="wrap"><button class="back" data-back>← Voltar ao painel</button><section class="hero"><div><div class="kicker">ANÁLISE INDIVIDUAL</div><h1>Scouting</h1><p>Avaliação técnica, tática, física, decisão e posicionamento.</p></div></section><section class="panel"><div class="filters"><label class="field"><small>ATLETA</small><select id="ath"><option>Gabriel Rios Fernandes</option><option>Vinícius Alves Pinho</option><option>Rian Pedreira Lima</option><option>Nycolas Santana Silva</option></select></label><label class="field"><small>DATA</small><input id="date" type="date"></label></div><div class="cards" style="margin-top:15px"><div class="card"><b>Técnica</b><div class="choices" data-score="tecnica"></div></div><div class="card"><b>Tática</b><div class="choices" data-score="tatica"></div></div><div class="card"><b>Tomada de decisão</b><div class="choices" data-score="decisao"></div></div><div class="card"><b>Posicionamento</b><div class="choices" data-score="posicionamento"></div></div><div class="card"><b>Intensidade</b><div class="choices" data-score="intensidade"></div></div></div><div class="field" style="margin-top:12px"><small>OBSERVAÇÕES</small><textarea id="obs" rows="4" placeholder="Notas da comissão"></textarea></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="save">Salvar avaliação</button></div></section><div id="toast" class="toast"></div></main></div><script src="soit-modulo.js"></script><script>(function(){document.querySelectorAll('[data-score]').forEach(g=>{g.innerHTML=Array.from({length:11},(_,n)=>'<button class="choice" data-v="'+n+'">'+n+'</button>').join('');g.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;g.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));b.classList.add('on')}});save.onclick=()=>soitToast('Avaliação salva neste dispositivo')})();</script></body></html>
