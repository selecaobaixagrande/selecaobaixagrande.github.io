<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Gerenciar Atletas | Seleção de Baixa Grande</title><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
}

/* HEADER */

header{
    background:#0d0d0d;
    border-bottom:1px solid #292929;
}

.header{
    max-width:1150px;
    margin:auto;
    padding:15px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.marca{
    display:flex;
    align-items:center;
    gap:12px;

    color:#fff;
    text-decoration:none;
}

.logo{
    width:52px;
    height:52px;
    object-fit:contain;
}

.marca h1{
    margin:0;
    font-size:18px;
}

.marca span{
    color:#b5121b;
}

.btn-painel{
    background:#292929;
    color:#fff;
    text-decoration:none;
    padding:11px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
}

/* MAIN */

main{
    max-width:1150px;
    margin:auto;
    padding:35px 20px 70px;
}

.titulo{
    margin-bottom:25px;
}

.titulo small{
    color:#b5121b;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;
}

.titulo h2{
    margin:7px 0;
    font-size:30px;
}

.titulo p{
    margin:0;
    color:#999;
    font-size:14px;
}

/* MENSAGEM */

.mensagem{
    display:none;
    margin-bottom:18px;
    padding:14px 16px;
    border-radius:9px;
    font-size:13px;
}

.mensagem.erro{
    display:block;
    background:#2a0d0f;
    border:1px solid #7d1d25;
    color:#ff9da3;
}

.mensagem.sucesso{
    display:block;
    background:#0d2a16;
    border:1px solid #276b3a;
    color:#9dffb4;
}

/* BARRA DE CONTROLE */

.controle{
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
    padding:18px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    margin-bottom:18px;
}

.controle-esquerda{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.contador{
    color:#999;
    font-size:13px;
    display:flex;
    align-items:center;
}

/* BOTÕES */

.btn{
    border:0;
    border-radius:8px;
    padding:11px 15px;

    background:#b5121b;
    color:#fff;

    font-weight:bold;
    font-size:13px;

    cursor:pointer;
}

.btn:hover{
    background:#e32632;
}

.btn-sec{
    background:#292929;
}

.btn-sec:hover{
    background:#3a3a3a;
}

/* FILTROS */

.filtros{
    display:grid;
    grid-template-columns:1fr 210px;
    gap:10px;
    margin-bottom:20px;
}

input,
select{
    width:100%;

    padding:13px;

    border-radius:9px;

    border:1px solid #292929;

    background:#111;

    color:#fff;

    outline:none;

    font-size:13px;
}

input:focus,
select:focus{
    border-color:#b5121b;
}

/* LISTA */

.lista{
    display:grid;
    gap:12px;
}

.carregando,
.vazio{
    background:#111;
    border:1px solid #292929;
    border-radius:14px;

    padding:45px 20px;

    text-align:center;

    color:#999;
}

/* ATLETA */

.atleta{
    background:#111;
    border:1px solid #292929;
    border-radius:14px;

    padding:16px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;

    transition:.2s;
}

.atleta:hover{
    border-color:#b5121b;
}

.atleta-info{
    display:flex;
    align-items:center;
    gap:15px;

    min-width:0;
}

.atleta-foto{
    width:68px;
    height:68px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #b5121b;

    background:#222;

    flex-shrink:0;
}

.atleta-dados{
    min-width:0;
}

.atleta-dados h3{
    margin:0 0 6px;

    font-size:17px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.atleta-dados p{
    margin:3px 0;

    color:#999;

    font-size:12px;
}

.tag{
    display:inline-block;

    margin-top:7px;

    padding:5px 9px;

    border-radius:15px;

    background:#2a0d0f;

    border:1px solid #7d1d25;

    color:#ff9da3;

    font-size:11px;

    font-weight:bold;
}

/* AÇÕES DO ATLETA */

.acoes-atleta{
    display:flex;
    gap:8px;

    flex-shrink:0;
}

.btn-editar{
    background:#b5121b;
}

.btn-excluir{
    background:#292929;
}

.btn-excluir:hover{
    background:#7d1d25;
}

/* MODAL */

.modal{
    display:none;

    position:fixed;

    inset:0;

    z-index:1000;

    background:rgba(0,0,0,.82);

    padding:20px;

    overflow-y:auto;
}

.modal.ativo{
    display:block;
}

.modal-caixa{
    width:100%;
    max-width:650px;

    margin:20px auto;

    background:#111;

    border:1px solid #292929;

    border-radius:16px;

    padding:25px;
}

.modal-caixa h2{
    margin:0 0 22px;
    font-size:22px;
}

.form-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:14px;
}

.campo{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.campo.full{
    grid-column:1 / -1;
}

.campo label{
    color:#aaa;
    font-size:12px;
    font-weight:bold;
}

.modal-acoes{
    display:flex;
    gap:10px;
    margin-top:22px;
}

/* FOOTER */

footer{
    text-align:center;

    padding:25px 20px;

    background:#0d0d0d;

    border-top:1px solid #292929;

    color:#777;

    font-size:12px;
}

footer strong{
    color:#fff;
}

/* CELULAR */

@media(max-width:750px){

    .header{
        flex-direction:column;
        text-align:center;
    }

    .controle{
        flex-direction:column;
        align-items:stretch;
    }

    .controle-esquerda{
        width:100%;
    }

    .controle-esquerda .btn{
        flex:1;
    }

    .contador{
        justify-content:center;
    }

    .filtros{
        grid-template-columns:1fr;
    }

    .atleta{
        align-items:stretch;
        flex-direction:column;
    }

    .acoes-atleta{
        width:100%;
    }

    .acoes-atleta .btn{
        flex:1;
    }

}

@media(max-width:550px){

    main{
        padding:25px 15px 50px;
    }

    .titulo h2{
        font-size:25px;
    }

    .atleta-info{
        align-items:flex-start;
    }

    .atleta-dados h3{
        white-space:normal;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .campo.full{
        grid-column:auto;
    }

    .modal-acoes{
        flex-direction:column;
    }

    .modal-acoes .btn{
        width:100%;
    }

}

</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

"use strict";


/* SUPABASE */

const SUPABASE_URL =
"https://lvxwziztdngntoqypzga.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* ELEMENTOS */

const lista =
document.getElementById("lista");

const contador =
document.getElementById("contador");

const mensagem =
document.getElementById("mensagem");

const busca =
document.getElementById("busca");

const filtroCategoria =
document.getElementById("filtroCategoria");

const modal =
document.getElementById("modal");

const tituloModal =
document.getElementById("tituloModal");


let atletas = [];

let atletaEditando = null;


/* MENSAGEM */

function mostrarMensagem(texto,tipo){

    mensagem.textContent =
        texto;

    mensagem.className =
        "mensagem " + tipo;

}


/* VERIFICAR LOGIN */

async function verificarLogin(){

    const resultado =
        await supabaseClient
            .auth
            .getSession();


    if(resultado.error){

        mostrarMensagem(
            "Erro ao verificar o login: " +
            resultado.error.message,
            "erro"
        );

        return false;
    }


    if(!resultado.data.session){

        window.location.href =
            "login-treinador.html";

        return false;
    }


    return true;

}


/* CARREGAR */

async function carregarAtletas(){

    lista.innerHTML =
        '<div class="carregando">⏳ Carregando atletas...</div>';

    contador.textContent =
        "Carregando...";


    const resultado =
        await supabaseClient
            .from("Atletas")
            .select("*")
            .order("nome",{ascending:true});


    if(resultado.error){

        console.error(
            "ERRO SUPABASE:",
            resultado.error
        );


        contador.textContent =
            "Erro";


        lista.innerHTML =
            '<div class="vazio">' +
            '<strong>Não foi possível carregar os atletas.</strong>' +
            '<br><br>' +
            'Erro: ' +
            resultado.error.message +
            '</div>';


        mostrarMensagem(
            "O Supabase recusou a leitura da tabela Atletas: " +
            resultado.error.message,
            "erro"
        );

        return;

    }


    atletas =
        resultado.data || [];


    renderizar();

}


/* RENDERIZAR */

function renderizar(){

    const termo =
        busca.value
            .trim()
            .toLowerCase();


    const categoria =
        filtroCategoria.value;


    const filtrados =
        atletas.filter(function(atleta){

            const nome =
                String(
                    atleta.nome || ""
                ).toLowerCase();


            const passouNome =
                nome.includes(termo);


            const passouCategoria =
                !categoria ||
                atleta.categoria === categoria;


            return
                passouNome &&
                passouCategoria;

        });


    contador.textContent =
        filtrados.length +
        (
            filtrados.length === 1
                ? " atleta encontrado"
                : " atletas encontrados"
        );


    if(!filtrados.length){

        lista.innerHTML =
            '<div class="vazio">' +
            '👤 Nenhum atleta encontrado.' +
            '<br><br>' +
            '<button class="btn" onclick="abrirCadastro()">' +
            '➕ Cadastrar primeiro atleta' +
            '</button>' +
            '</div>';

        return;

    }


    lista.innerHTML =
        filtrados.map(function(atleta){

            const foto =
                atleta.foto ||
                "1000001685.png";


            return `

            <div class="atleta">

                <div class="atleta-info">

                    <img
                    src="${escapeHtml(foto)}"
                    class="atleta-foto"
                    alt="Foto do atleta"
                    onerror="this.src='1000001685.png';">

                    <div class="atleta-dados">

                        <h3>
                        ${escapeHtml(atleta.nome || "Atleta")}
                        </h3>

                        <p>
                        ${escapeHtml(atleta.email || "Sem e-mail")}
                        </p>

                        <p>
                        ${escapeHtml(atleta.posicao || "Posição não informada")}
                        </p>

                        <span class="tag">
                        ${escapeHtml(atleta.categoria || "Sem categoria")}
                        </span>

                    </div>

                </div>


                <div class="acoes-atleta">

                    <button
                    class="btn btn-editar"
                    onclick="editarAtleta('${atleta.id}')">

                    ✏️ Editar

                    </button>


                    <button
                    class="btn btn-excluir"
                    onclick="excluirAtleta('${atleta.id}')">

                    🗑️ Excluir

                    </button>

                </div>

            </div>

            `;

        }).join("");

}


/* PROTEÇÃO DE TEXTO */

function escapeHtml(valor){

    return String(valor)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ABRIR CADASTRO */

function abrirCadastro(){

    atletaEditando =
        null;


    tituloModal.textContent =
        "Cadastrar atleta";


    limparFormulario();


    modal.classList.add(
        "ativo"
    );

}


window.abrirCadastro =
    abrirCadastro;


/* EDITAR */

window.editarAtleta =
function(id){

    const atleta =
        atletas.find(function(item){

            return String(item.id) === String(id);

        });


    if(!atleta){

        mostrarMensagem(
            "Atleta não encontrado.",
            "erro"
        );

        return;

    }


    atletaEditando =
        atleta;


    tituloModal.textContent =
        "Editar atleta";


    document.getElementById("nome").value =
        atleta.nome || "";


    document.getElementById("email").value =
        atleta.email || "";


    document.getElementById("categoria").value =
        atleta.categoria || "";


    document.getElementById("posicao").value =
        atleta.posicao || "";


    document.getElementById("nascimento").value =
        atleta.data_nascimento || "";


    document.getElementById("instagram").value =
        atleta.instagram || "";


    document.getElementById("foto").value =
        atleta.foto || "";


    modal.classList.add(
        "ativo"
    );

};


/* LIMPAR */

function limparFormulario(){

    document.getElementById("nome").value =
        "";

    document.getElementById("email").value =
        "";

    document.getElementById("categoria").value =
        "";

    document.getElementById("posicao").value =
        "";

    document.getElementById("nascimento").value =
        "";

    document.getElementById("instagram").value =
        "";

    document.getElementById("foto").value =
        "";

}


/* FECHAR */

function fecharModal(){

    modal.classList.remove(
        "ativo"
    );

    atletaEditando =
        null;

}


document
.getElementById("btnCancelar")
.addEventListener(
    "click",
    fecharModal
);


/* SALVAR */

async function salvarAtleta(){

    const nome =
        document.getElementById("nome")
            .value
            .trim();


    const email =
        document.getElementById("email")
            .value
            .trim()
            .toLowerCase();


    const categoria =
        document.getElementById("categoria")
            .value;


    const posicao =
        document.getElementById("posicao")
            .value;


    const nascimento =
        document.getElementById("nascimento")
            .value;


    const instagram =
        document.getElementById("instagram")
            .value
            .trim();


    const foto =
        document.getElementById("foto")
            .value
            .trim();


    if(!nome){

        mostrarMensagem(
            "Digite o nome do atleta.",
            "erro"
        );

        return;

    }


    if(!email){

        mostrarMensagem(
            "Digite o e-mail do atleta.",
            "erro"
        );

        return;

    }


    if(!categoria){

        mostrarMensagem(
            "Selecione a categoria.",
            "erro"
        );

        return;

    }


    const dados = {

        nome: nome,

        email: email,

        categoria: categoria,

        posicao:
            posicao || null,

        data_nascimento:
            nascimento || null,

        instagram:
            instagram || null,

        foto:
            foto || null

    };


    const botao =
        document.getElementById("btnSalvar");


    botao.disabled =
        true;


    botao.textContent =
        "SALVANDO...";


    let resultado;


    if(atletaEditando){

        resultado =
            await supabaseClient
                .from("Atletas")
                .update(dados)
                .eq(
                    "id",
                    atletaEditando.id
                );

    }else{

        resultado =
            await supabaseClient
                .from("Atletas")
                .insert(dados);

    }


    botao.disabled =
        false;


    botao.textContent =
        "💾 Salvar atleta";


    if(resultado.error){

        console.error(
            resultado.error
        );


        mostrarMensagem(
            "Erro ao salvar: " +
            resultado.error.message,
            "erro"
        );

        return;

    }


    fecharModal();


    mostrarMensagem(
        atletaEditando
            ? "Atleta atualizado com sucesso!"
            : "Atleta cadastrado com sucesso!",
        "sucesso"
    );


    carregarAtletas();

}


/* EXCLUIR */

window.excluirAtleta =
async function(id){

    const atleta =
        atletas.find(function(item){

            return String(item.id) === String(id);

        });


    if(!atleta){

        return;

    }


    if(
        !confirm(
            "Deseja realmente excluir " +
            atleta.nome +
            "?"
        )
    ){

        return;

    }


    const resultado =
        await supabase
