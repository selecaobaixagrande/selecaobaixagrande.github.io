<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciar Atletas | Seleção de Baixa Grande</title><style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
}

header{
    background:#0d0d0d;
    border-bottom:1px solid #292929;
}

.header{
    max-width:1200px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.marca{
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    text-decoration:none;
}

.logo{
    width:52px;
    height:52px;
    object-fit:contain;
}

.marca h1{
    margin:0;
    font-size:18px;
}

.marca span{
    color:#b5121b;
}

.btn-voltar{
    padding:10px 15px;
    border-radius:8px;
    background:#292929;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

main{
    max-width:1200px;
    margin:auto;
    padding:35px 20px 70px;
}

.topo{
    margin-bottom:25px;
}

.topo small{
    color:#b5121b;
    font-weight:bold;
    text-transform:uppercase;
    font-size:12px;
}

.topo h2{
    margin:8px 0;
    font-size:30px;
}

.topo p{
    color:#999;
    margin:0;
}

.acoes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.btn{
    border:0;
    border-radius:8px;
    padding:12px 17px;
    background:#b5121b;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#e32632;
}

.btn-sec{
    background:#292929;
}

.btn-sec:hover{
    background:#3a3a3a;
}

.filtros{
    display:grid;
    grid-template-columns:1fr 220px;
    gap:10px;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #292929;
    background:#111;
    color:#fff;
    outline:none;
}

input:focus,select:focus{
    border-color:#b5121b;
}

.mensagem{
    display:none;
    padding:14px;
    border-radius:9px;
    margin-bottom:20px;
    font-size:13px;
}

.mensagem.sucesso{
    display:block;
    background:#0d2a16;
    border:1px solid #276b3a;
    color:#9dffb4;
}

.mensagem.erro{
    display:block;
    background:#2a0d0f;
    border:1px solid #7d1d25;
    color:#ff9da3;
}

.lista{
    display:grid;
    gap:12px;
}

.atleta{
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.atleta-info{
    display:flex;
    align-items:center;
    gap:15px;
    min-width:0;
}

.atleta-foto{
    width:65px;
    height:65px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #b5121b;
    background:#222;
    flex-shrink:0;
}

.atleta-info h3{
    margin:0 0 5px;
    font-size:17px;
}

.atleta-info p{
    margin:3px 0;
    color:#999;
    font-size:13px;
}

.tag{
    display:inline-block;
    margin-top:5px;
    padding:5px 9px;
    border-radius:15px;
    background:#2a0d0f;
    border:1px solid #7d1d25;
    color:#ff9da3;
    font-size:11px;
    font-weight:bold;
}

.acoes-atleta{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.btn-editar{
    background:#b5121b;
}

.btn-excluir{
    background:#292929;
}

.btn-excluir:hover{
    background:#7d1d25;
}

.vazio{
    text-align:center;
    padding:60px 20px;
    color:#888;
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
}

.contador{
    color:#999;
    font-size:13px;
    margin-bottom:12px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    padding:20px;
    overflow:auto;
    z-index:1000;
}

.modal.ativo{
    display:block;
}

.modal-caixa{
    max-width:650px;
    margin:30px auto;
    background:#111;
    border:1px solid #292929;
    border-radius:16px;
    padding:25px;
}

.modal-caixa h2{
    margin-top:0;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.campo label{
    display:block;
    margin-bottom:6px;
    color:#aaa;
    font-size:12px;
    font-weight:bold;
}

.campo{
    margin-bottom:5px;
}

.campo.full{
    grid-column:1/-1;
}

.modal-acoes{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.carregando{
    text-align:center;
    padding:50px;
    color:#999;
}

footer{
    text-align:center;
    padding:25px;
    background:#0d0d0d;
    border-top:1px solid #292929;
    color:#777;
    font-size:12px;
}

@media(max-width:700px){
    .header{
        flex-direction:column;
        text-align:center;
    }

    .filtros{
        grid-template-columns:1fr;
    }

    .atleta{
        flex-direction:column;
        align-items:stretch;
    }

    .acoes-atleta{
        width:100%;
    }

    .acoes-atleta .btn{
        flex:1;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .campo.full{
        grid-column:auto;
    }

    .modal-acoes{
        flex-direction:column;
    }

    .modal-acoes .btn{
        width:100%;
    }
}
</style></head><body><header>

</a></div>
</header><main><div class="topo">
<small>Comissão técnica</small>
<h2>👥 Gerenciar atletas</h2>
<p>Cadastre, edite e organize os atletas da Seleção de Baixa Grande.</p>
</div><div id="mensagem" class="mensagem"></div><div class="acoes">
<button class="btn" id="btnNovo">
➕ Cadastrar atleta
</button><button class="btn btn-sec" id="btnAtualizar">
🔄 Atualizar lista
</button>
</div><div class="filtros"><input
type="search"
id="busca"
placeholder="🔎 Buscar atleta pelo nome..."

<select id="filtroCategoria">
<option value="">Todas as categorias</option>
<option value="Sub-13">Sub-13</option>

</footer><!-- MODAL --><div id="modal" class="modal"><div class="modal-caixa"><h2 id="tituloModal">
Cadastrar atleta
</h2><div class="form-grid"><div class="campo full">
<label>Nome completo</label>
<input id="nome" type="text" placeholder="Nome do atleta">
</div><div class="campo">
<label>E-mail</label>
<input id="email" type="email" placeholder="E-mail do atleta">
</div><div class="campo">
<label>Categoria</label><select id="categoria">
<option value="">Selecione</option>
<option value="Sub-13">Sub-13</option>
<option value="Sub-15">Sub-15</option>
<option value="Sub-17">Sub-17</option>
<option value="Sub-20">Sub-20</option>
</select></div><div class="campo">
<label>Posição</label>
<select id="posicao">
<option value="">Selecione</option>
<option value="Goleiro">Goleiro</option>
<option value="Lateral Direito">Lateral Direito</option>
<option value="Lateral Esquerdo">Lateral Esquerdo</option>
<option value="Zagueiro">Zagueiro</option>
<option value="Volante">Volante</option>
<option value="Meia">Meia</option>
<option value="Ponta">Ponta</option>
<option value="Atacante">Atacante</option>
</select>
</div><div class="campo">
<label>Data de nascimento</label>
<input id="nascimento" type="date">
</div><div class="campo">
<label>Instagram</label>
<input id="instagram" type="text" placeholder="@usuario">
</div><div class="campo full">
<label>Foto do atleta — URL</label>
<input id="foto" type="text" placeholder="https://...">
</div></div><div class="modal-acoes"><button class="btn" id="btnSalvar">
💾 Salvar atleta
</button><button class="btn btn-sec" id="btnCancelar">
Cancelar
</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

"use strict";

const SUPABASE_URL =
"https://lvxwziztdngntoqypzga.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


const lista =
document.getElementById("lista");

const mensagem =
document.getElementById("mensagem");

const contador =
document.getElementById("contador");

const modal =
document.getElementById("modal");

const tituloModal =
document.getElementById("tituloModal");

const busca =
document.getElementById("busca");

const filtroCategoria =
document.getElementById("filtroCategoria");

let atletas = [];

let atletaEditando = null;


/* MENSAGEM */

function mostrarMensagem(texto,tipo){

    mensagem.textContent = texto;

    mensagem.className =
        "mensagem " + tipo;

    setTimeout(function(){

        mensagem.className =
            "mensagem";

    },4000);

}


/* VERIFICAR TREINADOR */

async function verificarTreinador(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();

    if(error || !data.user){

        window.location.href =
            "login-treinador.html";

        return false;

    }

    return true;
}


/* CARREGAR ATLETAS */

async function carregarAtletas(){

    lista.innerHTML =
        '<div class="carregando">Carregando atletas...</div>';

    const resultado =
        await supabaseClient
            .from("Atletas")
            .select("*")
            .order("nome",{ascending:true});

    if(resultado.error){

        console.error(resultado.error);

        lista.innerHTML =
            '<div class="vazio">Não foi possível carregar os atletas.</div>';

        mostrarMensagem(
            "Erro ao carregar atletas. Verifique as políticas da tabela Atletas.",
            "erro"
        );

        return;
    }

    atletas =
        resultado.data || [];

    renderizarAtletas();
}


/* RENDERIZAR */

function renderizarAtletas(){

    const texto =
        busca.value
            .trim()
            .toLowerCase();

    const categoria =
        filtroCategoria.value;

    const filtrados =
        atletas.filter(function(atleta){

            const nome =
                String(
                    atleta.nome || ""
                ).toLowerCase();

            const correspondeNome =
                nome.includes(texto);

            const correspondeCategoria =
                !categoria ||
                atleta.categoria === categoria;

            return
                correspondeNome &&
                correspondeCategoria;

        });


    contador.textContent =
        filtrados.length +
        (
            filtrados.length === 1
                ? " atleta"
                : " atletas"
        );


    if(!filtrados.length){

        lista.innerHTML =
            '<div class="vazio">' +
            'Nenhum atleta encontrado.' +
            '</div>';

        return;
    }


    lista.innerHTML =
        filtrados.map(function(atleta){

            const foto =
                atleta.foto ||
                "1000001685.png";

            const nome =
                atleta.nome ||
                "Atleta";

            const categoria =
                atleta.categoria ||
                "-";

            const posicao =
                atleta.posicao ||
                "-";

            const email =
                atleta.email ||
                "-";


            return `
            <div class="atleta">

                <div class="atleta-info">

                    <img
                        class="atleta-foto"
                        src="${foto}"
                        alt="Foto de ${nome}"
                        onerror="this.src='1000001685.png';"
                    >

                    <div>

                        <h3>
                            ${nome}
                        </h3>

                        <p>
                            ${email}
                        </p>

                        <p>
                            ${posicao}
                        </p>

                        <span class="tag">
                            ${categoria}
                        </span>

                    </div>

                </div>


                <div class="acoes-atleta">

                    <button
                        class="btn btn-editar"
                        onclick="editarAtleta('${atleta.id}')"
                    >
                        ✏️ Editar
                    </button>

                    <button
                        class="btn btn-excluir"
                        onclick="excluirAtleta('${atleta.id}')"
                    >
                        🗑️ Excluir
                    </button>

                </div>

            </div>
            `;

        }).join("");

}


/* ABRIR CADASTRO */

function abrirCadastro(){

    atletaEditando = null;

    tituloModal.textContent =
        "Cadastrar atleta";

    limparFormulario();

    modal.classList.add("ativo");

}


/* EDITAR */

window.editarAtleta =
function(id){

    const atleta =
        atletas.find(function(item){

            return String(item.id) === String(id);

        });


    if(!atleta){

        mostrarMensagem(
            "Atleta não encontrado.",
            "erro"
        );

        return;
    }


    atletaEditando =
        atleta;


    tituloModal.textContent =
        "Editar atleta";


    document.getElementById("nome").value =
        atleta.nome || "";

    document.getElementById("email").value =
        atleta.email || "";

    document.getElementById("categoria").value =
        atleta.categoria || "";

    document.getElementById("posicao").value =
        atleta.posicao || "";

    document.getElementById("nascimento").value =
        atleta.data_nascimento || "";

    document.getElementById("instagram").value =
        atleta.instagram || "";

    document.getElementById("foto").value =
        atleta.foto || "";


    modal.classList.add("ativo");

};


/* LIMPAR */

function limparFormulario(){

    document.getElementById("nome").value = "";

    document.getElementById("email").value = "";

    document.getElementById("categoria").value = "";

    document.getElementById("posicao").value = "";

    document.getElementById("nascimento").value = "";

    document.getElementById("instagram").value = "";

    document.getElementById("foto").value = "";

}


/* FECHAR */

function fecharModal(){

    modal.classList.remove("ativo");

    atletaEditando = null;

}


/* SALVAR */

async function salvarAtleta(){

    const nome =
        document.getElementById("nome")
            .value.trim();

    const email =
        document.getElementById("email")
            .value.trim()
            .toLowerCase();

    const categoria =
        document.getElementById("categoria")
            .value;

    const posicao =
        document.getElementById("posicao")
            .value;

    const nascimento =
        document.getElementById("nascimento")
            .value;

    const instagram =
        document.getElementById("instagram")
            .value.trim();

    const foto =
        document.getElementById("foto")
            .value.trim();


    if(!nome){

        mostrarMensagem(
            "Digite o nome do atleta.",
            "erro"
        );

        return;
    }


    if(!email){

        mostrarMensagem(
            "Digite o e-mail do atleta.",
            "erro"
        );

        return;
    }


    if(!categoria){

        mostrarMensagem(
            "Selecione a categoria.",
            "erro"
        );

        return;
    }


    const dados = {

        nome: nome,

        email: email,

        categoria: categoria,

        posicao: posicao || null,

        data_nascimento:
            nascimento || null,

        instagram:
            instagram || null,

        foto:
            foto || null

    };


    const btn =
        document.getElementById("btnSalvar");

    btn.disabled = true;

    btn.textContent =
        "SALVANDO...";


    let resultado;


    if(atletaEditando){

        resultado =
            await supabaseClient
                .from("Atletas")
                .update(dados)
                .eq(
                    "id",
                    atletaEditando.id
                );

    }else{

        resultado =
            await supabaseClient
                .from("Atletas")
                .insert(dados);

    }


    btn.disabled = false;

    btn.textContent =
        "💾 Salvar atleta";


    if(resultado.error){

        console.error(
            resultado.error
        );

        mostrarMensagem(
            "Não foi possível salvar o atleta: " +
            resultado.error.message,
            "erro"
        );

        return;
    }


    fecharModal();

    mostrarMensagem(
        atletaEditando
            ? "Atleta atualizado com sucesso!"
            : "Atleta cadastrado com sucesso!",
        "sucesso"
    );


    await carregarAtletas();

}


/* EXCLUIR */

window.excluirAtleta =
async function(id){

    const atleta =
        atletas.find(function(item){

            return String(item.id) === String(id);

        });


    if(!atleta){
        return;
    }


    const confirmar =
        confirm(
            "Tem certeza que deseja excluir " +
            (atleta.nome || "este atleta") +
            "?"
        );


    if(!confirmar){
        return;
    }


    const resultado =
        await supabaseClient
            .from("Atletas")
            .delete()
            .eq("id",id);


    if(resultado.error){

        console.error(
            resultado.error
        );

        mostrarMensagem(
            "Não foi possível excluir o atleta: " +
            resultado.error.message,
            "erro"
        );

        return;
    }


    mostrarMensagem(
        "Atleta excluído com sucesso.",
        "sucesso"
    );


    await carregarAtletas();

};


/* EVENTOS */

document
    .getElementById("btnNovo")
    .addEventListener(
        "click",
        abrirCadastro
    );


document
    .getElementById("btnCancelar")
    .addEventListener(
        "click",
        fecharModal
    );


document
    .getElementById("btnSalvar")
    .addEventListener(
        "click",
        salvarAtleta
    );


document
    .getElementById("btnAtualizar")
    .addEventListener(
        "click",
        carregarAtletas
    );


busca.addEventListener(
    "input",
    renderizarAtletas
);


filtroCategoria.addEventListener(
    "change",
    renderizarAtletas
);


/* INICIAR */

(async function(){

    const autorizado =
        await verificarTreinador();

    if(autorizado){

        carregarAtletas();

    }

})();

</script></body>
