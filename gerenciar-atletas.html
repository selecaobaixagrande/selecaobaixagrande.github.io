<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gerenciar Atletas | Seleção de Baixa Grande</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
}

header{
    background:#0d0d0d;
    border-bottom:1px solid #292929;
}

.header{
    max-width:1200px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.marca{
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    text-decoration:none;
}

.logo{
    width:52px;
    height:52px;
    object-fit:contain;
}

.marca h1{
    margin:0;
    font-size:18px;
}

.marca h1 span{
    color:#b5121b;
}

.btn-voltar{
    padding:10px 15px;
    border-radius:8px;
    background:#292929;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    font-size:13px;
}

main{
    max-width:1200px;
    margin:auto;
    padding:35px 20px 70px;
}

.topo{
    margin-bottom:25px;
}

.topo small{
    color:#b5121b;
    font-weight:bold;
    text-transform:uppercase;
    font-size:12px;
}

.topo h2{
    margin:7px 0;
    font-size:30px;
}

.topo p{
    color:#999;
    margin:0;
}

.barra{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

#pesquisa{
    flex:1;
    padding:13px 15px;
    background:#111;
    border:1px solid #292929;
    border-radius:9px;
    color:#fff;
    outline:none;
}

#pesquisa:focus{
    border-color:#b5121b;
}

.btn{
    border:0;
    border-radius:8px;
    padding:12px 17px;
    background:#b5121b;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:#e32632;
}

.btn-sec{
    background:#292929;
}

.mensagem{
    display:none;
    padding:14px;
    margin-bottom:20px;
    border-radius:9px;
    font-size:13px;
}

.mensagem.sucesso{
    display:block;
    background:#0d2a17;
    border:1px solid #226b3a;
    color:#8ff0ad;
}

.mensagem.erro{
    display:block;
    background:#2a0d0f;
    border:1px solid #7d1d25;
    color:#ff9da3;
}

.tabela-area{
    background:#111;
    border:1px solid #292929;
    border-radius:15px;
    overflow:hidden;
}

.tabela-topo{
    padding:18px 20px;
    border-bottom:1px solid #292929;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.tabela-topo strong{
    font-size:16px;
}

.tabela-topo span{
    color:#888;
    font-size:12px;
}

.tabela-scroll{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    text-align:left;
    padding:14px;
    background:#0d0d0d;
    color:#888;
    font-size:11px;
    text-transform:uppercase;
}

td{
    padding:14px;
    border-top:1px solid #222;
    font-size:13px;
}

tr:hover td{
    background:#151515;
}

.atleta{
    display:flex;
    align-items:center;
    gap:10px;
}

.atleta img{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #b5121b;
}

.nome-atleta{
    font-weight:bold;
}

.categoria{
    color:#999;
    font-size:11px;
    margin-top:3px;
}

.editar{
    padding:8px 12px;
    border:0;
    border-radius:7px;
    background:#b5121b;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.vazio{
    text-align:center;
    padding:50px 20px;
    color:#888;
}


/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:999;
    padding:20px;
    overflow-y:auto;
}

.modal.ativo{
    display:block;
}

.modal-caixa{
    max-width:850px;
    margin:30px auto;
    background:#111;
    border:1px solid #292929;
    border-radius:16px;
    padding:25px;
}

.modal-topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.modal-topo h3{
    margin:0;
    font-size:22px;
}

.fechar{
    width:38px;
    height:38px;
    border:0;
    border-radius:8px;
    background:#292929;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.foto-modal{
    text-align:center;
    margin-bottom:25px;
}

.foto-modal img{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #b5121b;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.campo label{
    display:block;
    color:#888;
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:7px;
}

.campo input,
.campo select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #292929;
    background:#080808;
    color:#fff;
    outline:none;
}

.campo input:focus,
.campo select:focus{
    border-color:#b5121b;
}

.secao{
    margin:25px 0 15px;
    padding-bottom:10px;
    border-bottom:1px solid #292929;
}

.secao h4{
    margin:0;
    color:#fff;
}

.botoes-modal{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
}

.carregando{
    text-align:center;
    padding:50px;
    color:#888;
}

@media(max-width:650px){

    .header{
        flex-direction:column;
        text-align:center;
    }

    .barra{
        flex-direction:column;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .botoes-modal{
        flex-direction:column;
    }

    .botoes-modal .btn{
        width:100%;
    }

}

</style>

</head>

<body>

<header>

<div class="header">

<a href="painel-treinador.html" class="marca">

<img
src="1000001685.png"
alt="Escudo da Seleção de Baixa Grande"
class="logo">

<h1>
SELEÇÃO DE <span>BAIXA GRANDE</span>
</h1>

</a>

<a
href="painel-treinador.html"
class="btn-voltar">

← Painel

</a>

</div>

</header>


<main>

<div class="topo">

<small>Área da comissão técnica</small>

<h2>👥 Gerenciar atletas</h2>

<p>
Consulte e atualize os dados e estatísticas dos atletas.
</p>

</div>


<div
id="mensagem"

</div>


<div class="barra">

type="search"
id="pesquisa"

<div class="tabela-scroll">

<table>

<th>Jogos</th>
<th>Gols</th>

</thead>

<tbody id="listaAtletas">

<tr>

<td

class="vazio">

Carregando atletas...

</td>

</tr>

</tbody>

</table>

</div>

</div>

</main>


<!-- MODAL -->

<div

class="modal">

<div class="modal-caixa">


<div class="modal-topo">

✏️ Editar atleta
</h3>

id="fecharModal"
class="fechar"
type="button">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* SUPABASE */

const SUPABASE_URL =
"https://lvxwziztdngntoqypzga.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* ELEMENTOS */

const listaAtletas =
document.getElementById("listaAtletas");

const contador =
document.getElementById("contador");

const pesquisa =
document.getElementById("pesquisa");

const mensagem =
document.getElementById("mensagem");

const modal =
document.getElementById("modal");


let atletas = [];

let atletaSelecionado = null;


/* MENSAGEM */

function mostrarMensagem(texto,tipo){

    mensagem.textContent =
        texto;

    mensagem.className =
        "mensagem " + tipo;

    setTimeout(function(){

        mensagem.className =
            "mensagem";

    },4000);

}


/* NÚMERO SEGURO */

function numero(valor){

    const n =
        Number(valor);

    return Number.isFinite(n)
        ? n
        : 0;

}


/* ESCAPAR HTML */

function escapar(valor){

    return String(
        valor ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* CARREGAR USUÁRIO */

async function verificarTreinador(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(error || !data.user){

        window.location.href =
            "login-treinador.html";

        return false;

    }


    const user =
        data.user;


    const perfilResultado =
        await supabaseClient
            .from("Perfis")
            .select("*")
            .eq("Email",user.email)
            .maybeSingle();


    if(
        perfilResultado.error ||
        !perfilResultado.data
    ){

        window.location.href =
            "login-treinador.html";

        return false;

    }


    const perfil =
        perfilResultado.data;


    const tipo =
        String(
            perfil.Tipo ||
            perfil.tipo ||
            ""
        )
        .trim()
        .toLowerCase();


    if(tipo !== "treinador"){

        await supabaseClient
            .auth
            .signOut();

        window.location.href =
            "login-treinador.html";

        return false;

    }


    return true;

}


/* CARREGAR ATLETAS */

async function carregarAtletas(){

    listaAtletas.innerHTML =
        `<tr>
            <td colspan="6" class="vazio">
                Carregando atletas...
            </td>
        </tr>`;


    const resultado =
        await supabaseClient
            .from("Atletas")
            .select("*")
            .order("nome",{ascending:true});


    if(resultado.error){

        console.error(
            resultado.error
        );

        listaAtletas.innerHTML =
            `<tr>
                <td colspan="6" class="vazio">
                    Não foi possível carregar os atletas.
                </td>
            </tr>`;

        mostrarMensagem(
            "Erro ao carregar os atletas.",
            "erro"
        );

        return;

    }


    atletas =
        resultado.data || [];


    renderizarAtletas(atletas);

}


/* RENDERIZAR */

function renderizarAtletas(lista){

    contador.textContent =
        lista.length +
        (lista.length === 1
            ? " atleta"
            : " atletas");


    if(!lista.length){

        listaAtletas.innerHTML =
            `<tr>
                <td colspan="6" class="vazio">
                    Nenhum atleta encontrado.
                </td>
            </tr>`;

        return;

    }


    listaAtletas.innerHTML =
        lista.map(function(atleta){

            const foto =
                escapar(
                    atleta.foto ||
                    "1000001685.png"
                );


            return `
            <tr>

                <td>

                    <div class="atleta">

                        <img
                        src="${foto}"
                        onerror="this.src='1000001685.png';"
                        alt="">

                        <div>

                            <div class="nome-atleta">
                                ${escapar(atleta.nome || "Atleta")}
                            </div>

                            <div class="categoria">
                                ${escapar(atleta.email || "-")}
                            </div>

                        </div>

                    </div>

                </td>


                <td>
                    ${escapar(atleta.posicao || "-")}
                </td>


                <td>
                    ${escapar(atleta.categoria || "-")}
                </td>


                <td>
                    ${numero(atleta.jogos)}
                </td>


                <td>
                    ${numero(atleta.gols)}
                </td>


                <td>

                    <button
                    class="editar"
                    type="button"
                    data-id="${escapar(atleta.id)}">

                    ✏️ Editar

                    </button>

                </td>

            </tr>
            `;

        })
        .join("");


    document
        .querySelectorAll(".editar")
        .forEach(function(botao){

            botao.addEventListener(
                "click",
                function(){

                    abrirEdicao(
                        this.dataset.id
                    );

                }
            );

        });

}


/* PESQUISA */

pesquisa.addEventListener(
    "input",
    function(){

        const termo =
            this.value
                .trim()
                .toLowerCase();


        if(!termo){

            renderizarAtletas(
                atletas
            );

            return;

        }


        const filtrados =
            atletas.filter(
                function(atleta){

                    return [

                        atleta.nome,
                        atleta.email,
                        atleta.categoria,
                        atleta.posicao

                    ]
                    .some(function(valor){

                        return String(
                            valor || ""
                        )
                        .toLowerCase()
                        .includes(termo);

                    });

                }
            );


        renderizarAtletas(
            filtrados
        );

    }
);


/* ABRIR EDIÇÃO */

function abrirEdicao(id){

    atletaSelecionado =
        atletas.find(
            function(atleta){

                return String(atleta.id) ===
                    String(id);

            }
        );


    if(!atletaSelecionado){

        mostrarMensagem(
            "Atleta não encontrado.",
            "erro"
        );

        return;

    }


    document.getElementById(
        "atletaId"
    ).value =
        atletaSelecionado.id;


    document.getElementById(
        "campoNome"
    ).value =
        atletaSelecionado.nome || "";


    document.getElementById(
        "campoEmail"
    ).value =
        atletaSelecionado.email || "";


    document.getElementById(
        "campoPosicao"
    ).value =
        atletaSelecionado.posicao || "";


    document.getElementById(
        "campoCategoria"
    ).value =
        atletaSelecionado.categoria || "";


    document.getElementById(
        "campoNascimento"
    ).value =
        atletaSelecionado.data_nascimento || "";


    document.getElementById(
        "campoInstagram"
    ).value =
        atletaSelecionado.instagram || "";


    document.getElementById(
        "campoFoto"
    ).value =
        atletaSelecionado.foto || "";


    document.getElementById(
        "campoJogos"
    ).value =
        numero(atletaSelecionado.jogos);


    document.getElementById(
        "campoGols"
    ).value =
        numero(atletaSelecionado.gols);


    document.getElementById(
        "campoAssistencias"
    ).value =
        numero(atletaSelecionado.assistencias);


    document.getElementById(
        "campoCartoes"
    ).value =
        numero(
            atletaSelecionado.cartoes_amarelos
        );


    document.getElementById(
        "campoAdvertencias"
    ).value =
        numero(
            atletaSelecionado.advertencias
        );


    document.getElementById(
        "campoFaltasTreino"
    ).value =
        numero(
            atletaSelecionado.faltas_treino
        );


    document.getElementById(
        "campoPresenca"
    ).value =
        atletaSelecionado.presenca ||
        atletaSelecionado.presenca_treino ||
        "";


    document.getElementById(
        "fotoModal"
    ).src =
        atletaSelecionado.foto ||
        "1000001685.png";


    modal.classList.add("ativo");

}


/* FECHAR */

function fecharModal(){

    modal.classList.remove(
        "ativo"
    );

    atletaSelecionado =
        null;

}


document.getElementById(
    "fecharModal"
).addEventListener(
    "click",
    fecharModal
);


document.getElementById(
    "cancelar"
).addEventListener(
    "click",
    fecharModal
);


modal.addEventListener(
    "click",
    function(event){

        if(event.target === modal){

            fecharModal();

        }

    }
);


/* SALVAR */

document.getElementById(
    "salvar"
).addEventListener(
    "click",
    async function(){

        if(!atletaSelecionado){

            return;

        }


        const botao =
            this;


        botao.disabled =
            true;

        botao.textContent =
            "SALVANDO...";


        try{

            const dados = {

                nome:
                    document.getElementById(
                        "campoNome"
                    ).value.trim(),

                email:
                    document.getElementById(
                        "campoEmail"
                    ).value.trim().toLowerCase(),

                posicao:
                    document.getElementById(
                        "campoPosicao"
                    ).value.trim(),

                categoria:
                    document.getElementById(
                        "campoCategoria"
                    ).value,

                data_nascimento:
                    document.getElementById(
                        "campoNascimento"
                    ).value || null,

                instagram:
