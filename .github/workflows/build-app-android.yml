name: Build APK — Seleção de Baixa Grande

on:
  push:
    paths:
      - "app-android/**"
      - ".github/workflows/build-app-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.13"

      - name: Gerar APK assinado para instalação
        working-directory: app-android
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: selecao-de-baixa-grande-apk
          path: app-android/app/build/outputs/apk/debug/Seleção De Baixa Grande.apk
          if-no-files-found: error
