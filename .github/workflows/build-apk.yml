name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          "$ANDROID_SDK_ROOT/platform-tools/adb" --version
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version 2>/dev/null || "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" --version

      - name: Generate Gradle wrapper
        working-directory: app-android
        run: gradle wrapper --gradle-version 8.13 --no-daemon

      - name: Build debug APK
        working-directory: app-android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f 'app-android/app/build/outputs/apk/debug/Seleção De Baixa Grande.apk'
          ls -lh 'app-android/app/build/outputs/apk/debug/Seleção De Baixa Grande.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: selecao-baixa-grande-apk
          path: app-android/app/build/outputs/apk/debug/Seleção De Baixa Grande.apk
          if-no-files-found: error
