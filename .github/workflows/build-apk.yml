name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          adb --version

      - name: Generate Gradle wrapper
        working-directory: app-android
        run: gradle wrapper --gradle-version 8.13 --no-daemon

      - name: Build debug APK
        working-directory: app-android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f app-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh app-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: selecao-baixa-grande-apk
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
