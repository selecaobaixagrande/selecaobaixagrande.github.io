<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar Resultados | Seleção de Baixa Grande</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}main{max-width:1050px;margin:auto;padding:30px 16px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#111;border:1px solid #292929;border-radius:14px;padding:18px;margin:18px 0}input,select{width:100%;padding:12px;background:#080808;color:#fff;border:1px solid #333;border-radius:8px;box-sizing:border-box}label{font-size:12px;color:#aaa}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button,a{padding:11px 15px;border:0;border-radius:8px;background:#b5121b;color:#fff;font-weight:bold;text-decoration:none;cursor:pointer}.sec{background:#292929}.item{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #292929;padding:15px 0}.muted{color:#999}.erro{display:none;background:#2a0d0f;color:#ff9da3;padding:12px;border-radius:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start;gap:10px}}</style></head><body><main><div class="top"><div><div class="muted">COMISSÃO TÉCNICA</div><h1>📊 Gerenciar resultados</h1></div><a class="sec" href="painel-treinador.html">← Painel</a></div><div id="erro" class="erro"></div><section class="card"><h2>Resultados finalizados</h2><div id="lista">Carregando...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY');const $=x=>document.getElementById(x);async function carregar(){const r=await sb.from('jogos').select('*').order('data_jogo',{ascending:false});if(r.error){$('erro').textContent=r.error.message;$('erro').style.display='block';return}const a=(r.data||[]).filter(j=>j.status==='finalizado');$('lista').innerHTML=a.length?a.map(j=>`<div class="item"><div><b>BAIXA GRANDE ${j.gols_baixa_grande??0} × ${j.gols_adversario??0} ${j.adversario||''}</b><div class="muted">${j.data_jogo||''} • ${j.competicao||'Sem competição'} • ${j.local||'Local não informado'}</div></div><button onclick="editar('${j.id}')">✏️ Alterar placar</button></div>`).join(''):'<p class="muted">Nenhum resultado finalizado.</p>'}window.editar=async id=>{const r=await sb.from('jogos').select('*').eq('id',id).single();if(r.error)return alert(r.error.message);const a=prompt('Gols da Seleção de Baixa Grande:',r.data.gols_baixa_grande??0);if(a===null)return;const b=prompt('Gols do adversário:',r.data.gols_adversario??0);if(b===null)return;const u=await sb.from('jogos').update({gols_baixa_grande:+a||0,gols_adversario:+b||0,status:'finalizado'}).eq('id',id);if(u.error)return alert(u.error.message);carregar()};carregar()</script></body></html>
