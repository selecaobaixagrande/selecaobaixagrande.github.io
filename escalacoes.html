<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escalações | Seleção de Baixa Grande</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:30px 16px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin-bottom:18px}.campo{position:relative;min-height:600px;border-radius:18px;background:linear-gradient(#185c2c,#267a39);overflow:hidden;border:3px solid #eee}.linha{position:absolute;left:4%;right:4%;height:2px;background:#ffffff66;top:50%}.circulo{position:absolute;width:150px;height:150px;border:2px solid #ffffff66;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.jogador{position:absolute;transform:translate(-50%,-50%);text-align:center}.bola{width:42px;height:42px;border-radius:50%;background:#b5121b;border:2px solid white;display:flex;align-items:center;justify-content:center;font-weight:bold;margin:auto}.nome{font-size:12px;font-weight:bold;background:#000b;border-radius:6px;padding:3px 5px;margin-top:3px;white-space:nowrap}.muted{color:#999}select{padding:12px;background:#080808;color:#fff;border:1px solid #333;border-radius:8px;width:100%}</style></head><body><main><div class="card"><div class="muted">SELEÇÃO DE BAIXA GRANDE</div><h1>📋 Escalação</h1><select id="jogo"><option value="">Carregando jogos...</option></select></div><div id="saida"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY');const $=id=>document.getElementById(id);let jogos=[];async function iniciar(){const r=await sb.from('jogos').select('*').order('data_jogo',{ascending:false});if(r.error){$('jogo').innerHTML='<option>Erro ao carregar jogos</option>';return}jogos=r.data||[];$('jogo').innerHTML='<option value="">Selecione uma partida</option>'+jogos.map(j=>`<option value="${j.id}">BAIXA GRANDE x ${j.adversario||''} — ${j.data_jogo||''}</option>`).join('');$('jogo').onchange=mostrar}async function mostrar(){const id=$('jogo').value;if(!id){$('saida').innerHTML='';return}const r=await sb.from('escalacoes').select('*').eq('jogo_id',id).eq('publicada',true).maybeSingle();if(r.error){$('saida').innerHTML='<div class="card">Não foi possível carregar a escalação.</div>';return}if(!r.data){$('saida').innerHTML='<div class="card">Ainda não há escalação publicada para esta partida.</div>';return}const e=r.data;let nomes=[];try{nomes=typeof e.titulares==='string'?JSON.parse(e.titulares):e.titulares||[]}catch{}const pos=[[50,90],[20,72],[40,72],[60,72],[80,72],[25,52],[50,52],[75,52],[25,28],[50,25],[75,28]];$('saida').innerHTML=`<div class="card"><h2>BAIXA GRANDE x ${jogos.find(j=>j.id==id)?.adversario||''}</h2><p class="muted">Formação: ${e.formacao||'Não informada'} ${e.capitao?' • Capitão: '+e.capitao:''}</p><div class="campo"><div class="linha"></div><div class="circulo"></div>${pos.map((p,i)=>{let n=nomes[i]||'Titular';return `<div class="jogador" style="left:${p[0]}%;top:${p[1]}%"><div class="bola">${i+1}</div><div class="nome">${n}</div></div>`}).join('')}</div><h3>🪑 Reservas</h3><p>${(e.reservas||[]).join(' • ')||'Não informados'}</p></div>`}iniciar()</script></body></html>
