<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avisos internos | SOIT</title><link rel="stylesheet" href="soit-modulo.css"></head><body><div class="app"><header class="top"><div class="brand"><img src="1000001685.png"><div><b>SOIT · SELEÇÃO DE BAIXA GRANDE</b><span>AVISOS INTERNOS</span></div></div><div class="pill" id="profilePill">RAMON</div></header><main class="wrap"><button class="back" data-back>← Voltar ao painel</button><section class="hero"><div><div class="kicker">COMUNICAÇÃO</div><h1>Avisos internos</h1><p>Comunicação da comissão técnica.</p></div></section><section class="panel"><div class="field"><small>TÍTULO</small><input id="t" placeholder="Título do aviso"></div><div class="field" style="margin-top:10px"><small>MENSAGEM</small><textarea id="m" rows="5" placeholder="Escreva o aviso"></textarea></div><button class="btn primary" style="margin-top:10px" id="save">Publicar aviso</button></section><section class="panel"><div class="panelTitle">Avisos neste dispositivo</div><div class="list" id="list"></div></section><div id="toast" class="toast"></div></main></div><script src="soit-modulo.js"></script><script>(function(){const K='soit_avisos';let a=JSON.parse(localStorage.getItem(K)||'[]');function r(){list.innerHTML=a.map(x=>'<div class="row"><div><strong>'+x.t+'</strong><small>'+x.m+'</small></div></div>').join('')||'<div class="note">Nenhum aviso.</div>'}save.onclick=()=>{if(!t.value.trim())return soitToast('Digite um título');a.unshift({t:t.value,m:m.value});localStorage.setItem(K,JSON.stringify(a));t.value='';m.value='';r();soitToast('Aviso publicado')};r()})();</script></body></html>
