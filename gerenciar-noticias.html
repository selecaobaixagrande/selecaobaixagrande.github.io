<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar Notícias | Seleção de Baixa Grande</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}main{max-width:1050px;margin:auto;padding:30px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#111;border:1px solid #292929;border-radius:14px;padding:18px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,textarea{width:100%;padding:12px;background:#080808;color:#fff;border:1px solid #333;border-radius:8px;box-sizing:border-box}label{font-size:12px;color:#aaa}button,a{padding:11px 15px;border:0;border-radius:8px;background:#b5121b;color:#fff;font-weight:bold;text-decoration:none;cursor:pointer}.sec{background:#292929}.item{border-top:1px solid #292929;padding:15px 0;display:flex;justify-content:space-between;gap:12px}.muted{color:#999}.erro{display:none;background:#2a0d0f;color:#ff9da3;padding:12px;border-radius:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{flex-direction:column}}</style></head><body><main><div class="top"><div><div class="muted">COMISSÃO TÉCNICA</div><h1>📰 Gerenciar notícias</h1><p class="muted">Publique as notícias oficiais da Seleção.</p></div><a class="sec" href="painel-treinador.html">← Painel</a></div><div id="erro" class="erro"></div><section class="card"><h2 id="titulo">Nova notícia</h2><div class="grid"><div class="full"><label>Título *</label><input id="tituloInput"></div><div class="full"><label>Resumo</label><textarea id="resumo" rows="2"></textarea></div><div class="full"><label>Conteúdo *</label><textarea id="conteudo" rows="7"></textarea></div><div><label>Imagem (URL opcional)</label><input id="imagem"></div><div><label>Publicar agora?</label><select id="publicado"><option value="true">Sim</option><option value="false">Não</option></select></div></div><br><button id="salvar">📰 Publicar notícia</button> <button id="cancelar" class="sec">Cancelar</button></section><section class="card"><h2>Notícias</h2><div id="lista">Carregando...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://lvxwziztdngntoqypzga.supabase.co','sb_publishable_iCXNkHI8bgQ4c9BEVE9M3A_wOY1tvzY');let edit=null;const $=x=>document.getElementById(x);function erro(t){$('erro').textContent=t;$('erro').style.display='block'}function reset(){edit=null;$('titulo').textContent='Nova notícia';$('tituloInput').value='';$('resumo').value='';$('conteudo').value='';$('imagem').value='';$('publicado').value='true'}async function carregar(){const r=await sb.from('noticias').select('*').order('criado_em',{ascending:false});if(r.error)return erro(r.error.message);$('lista').innerHTML=r.data?.length?r.data.map(n=>`<div class="item"><div><b>${n.titulo||''}</b><div class="muted">${n.publicado?'🟢 Publicada':'⚪ Rascunho'} • ${n.criado_em?new Date(n.criado_em).toLocaleDateString('pt-BR'):''}</div><div>${n.resumo||''}</div></div><div><button onclick="editar('${n.id}')">✏️ Editar</button> <button class="sec" onclick="excluir('${n.id}')">🗑️ Excluir</button></div></div>`).join(''):'<p class="muted">Nenhuma notícia cadastrada.</p>'}window.editar=async id=>{const r=await sb.from('noticias').select('*').eq('id',id).single();if(r.error)return erro(r.error.message);const n=r.data;edit=id;$('titulo').textContent='Editar notícia';$('tituloInput').value=n.titulo||'';$('resumo').value=n.resumo||'';$('conteudo').value=n.conteudo||'';$('imagem').value=n.imagem||'';$('publicado').value=String(!!n.publicado);scrollTo(0,0)};window.excluir=async id=>{if(!confirm('Excluir esta notícia?'))return;const r=await sb.from('noticias').delete().eq('id',id);if(r.error)return erro(r.error.message);carregar()};$('salvar').onclick=async()=>{if(!$('tituloInput').value.trim()||!$('conteudo').value.trim())return erro('Informe título e conteúdo.');const d={titulo:$('tituloInput').value.trim(),resumo:$('resumo').value.trim()||null,conteudo:$('conteudo').value.trim(),imagem:$('imagem').value.trim()||null,publicado:$('publicado').value==='true'};const r=edit?await sb.from('noticias').update(d).eq('id',edit):await sb.from('noticias').insert(d);if(r.error)return erro(r.error.message);reset();carregar()};$('cancelar').onclick=reset;carregar()</script></body></html>
